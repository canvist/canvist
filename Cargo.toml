[workspace]
members = [
	"crates/canvist",
	"crates/canvist_canvas",
	"crates/canvist_canvas_wasm",
	"crates/canvist_collab",
	"crates/canvist_core",
	"crates/canvist_desktop",
	"crates/canvist_extensions",
	"crates/canvist_ffi",
	"crates/canvist_headless",
	"crates/canvist_headless_wasm",
	"crates/canvist_layout",
	"crates/canvist_model",
	"crates/canvist_paint",
	"crates/canvist_scene",
	"crates/canvist_testkit",
	"crates/canvist_web",
	"docs",
	"examples/desktop",
	"platforms/dart/rust",
	"services/cloud",
	"tools/footage",
]
default-members = [
	"crates/canvist",
	"crates/canvist_collab",
	"crates/canvist_canvas",
	"crates/canvist_canvas_wasm",
	"crates/canvist_desktop",
	"crates/canvist_core",
	"crates/canvist_extensions",
	"crates/canvist_ffi",
	"crates/canvist_headless",
	"crates/canvist_headless_wasm",
	"crates/canvist_model",
	"crates/canvist_paint",
	"crates/canvist_layout",
	"crates/canvist_scene",
	"crates/canvist_web",
	"docs",
	"services/cloud",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
categories = ["wasm", "accessibility", "multimedia", "text-processing", "text-editors"]
edition = "2024"
homepage = "https://github.com/canvist/canvist"
include = ["src/**/*.rs", "Cargo.toml", "readme.md", "license"]
license = "Unlicense"
readme = "readme.md"
repository = "https://github.com/canvist/canvist"
rust-version = "1.95.0"

[workspace.dependencies]
axum = { default-features = false, version = "^0.8" }
base64 = { default-features = false, version = "^0.22" }
deadpool-postgres = { default-features = false, version = "^0.14" }
divan = { default-features = false, version = "^0.1" }
flutter_rust_bridge = { default-features = true, version = "=2.13.0" }
futures-util = { default-features = false, version = "^0.3" }
getrandom = { default-features = false, version = "^0.3" }
gungraun = { version = "^0.20" }
hmac = { default-features = false, version = "^0.12" }
insta = { default-features = false, version = "^1" }
js-sys = { default-features = false, version = "^0.3" }
kurbo = { default-features = false, version = "^0.13" }
log = { default-features = false, version = "^0.4" }
playwright-rs = { default-features = false, version = "^0.20" }
proptest = { default-features = false, version = "^1" }
regex-lite = { default-features = false, version = "^0.1" }
reqwest = { default-features = false, version = "^0.12" }
rustc-hash = { default-features = false, version = "^2" }
serde = { default-features = false, version = "^1" }
serde_json = { default-features = false, version = "^1" }
sha2 = { default-features = false, version = "^0.10" }
thiserror = { default-features = false, version = "^2" }
tokio = { default-features = false, version = "^1" }
tokio-postgres = { default-features = false, version = "^0.7" }
tokio-tungstenite = { default-features = false, version = "^0.28" }
tokio-util = { default-features = false, version = "^0.7" }
tower = { default-features = false, version = "^0.5" }
tower-http = { default-features = false, version = "^0.6" }
tracing = { default-features = false, version = "^0.1" }
tracing-subscriber = { default-features = false, version = "^0.3" }
unicode-segmentation = { default-features = false, version = "^1" }
uniffi = { default-features = false, version = "^0.32" }
wasm-bindgen = { default-features = false, version = "^0.2" }
wasm-bindgen-futures = { default-features = false, version = "^0.4" }
web-sys = { default-features = false, version = "^0.3" }
yrs = { default-features = false, version = "^0.28" }

# Internal crates
canvist = { path = "./crates/canvist", version = "0.1.0" }
canvist_canvas = { path = "./crates/canvist_canvas", version = "0.1.0" }
canvist_collab = { path = "./crates/canvist_collab", version = "0.1.0" }
canvist_core = { path = "./crates/canvist_core", version = "0.1.0" }
canvist_desktop = { path = "./crates/canvist_desktop", version = "0.1.0" }
canvist_extensions = { path = "./crates/canvist_extensions", version = "0.1.0" }
canvist_ffi = { path = "./crates/canvist_ffi", version = "0.1.0" }
canvist_headless = { path = "./crates/canvist_headless", version = "0.1.0" }
canvist_layout = { path = "./crates/canvist_layout", version = "0.1.0", default-features = false }
canvist_model = { path = "./crates/canvist_model", version = "0.1.0" }
canvist_paint = { path = "./crates/canvist_paint", version = "0.1.0" }
canvist_scene = { path = "./crates/canvist_scene", version = "0.1.0" }
canvist_web = { path = "./crates/canvist_web", version = "0.1.0" }

# `platforms/dart/rust` ships in a pub.dev archive, so it names canvist crates
# by their crates.io version (see its manifest). Build them from this checkout.
[patch.crates-io]
canvist_headless = { path = "./crates/canvist_headless" }
canvist_layout = { path = "./crates/canvist_layout" }

[workspace.metadata.bin]
cargo-insta = { version = "1.46.3" }
cargo-llvm-cov = { version = "0.8.4" }
cargo-ndk = { version = "4.1.2" }
cargo-nextest = { version = "0.9.129" }
cargo-semver-checks = { version = "0.46.0" }
cargo-deny = { version = "0.19.0" }
cargo-workspaces = { version = "0.4.2" }
flutter_rust_bridge_codegen = { version = "2.13.0" }

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# Individual lints
unsafe_code = "deny"
unstable_features = "deny"
# `@canvist/web` builds its module with `--cfg canvist_omit_docs`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(canvist_omit_docs)"] }
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.clippy]
# Group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Individual lints
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"

[profile.release]
lto = true
codegen-units = 1

[profile.release.package.canvist_headless_wasm]
opt-level = "s"

# WebAssembly packages trade a little speed for size: `wasm-pack build
# --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"

# The browser editor trades a little more: `opt-level = "z"` saves 25 KB
# gzipped over "s" (`@canvist/web`'s `build:wasm`).
[profile.wasm-web]
inherits = "wasm-release"
opt-level = "z"
