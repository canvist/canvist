# XcodeGen spec for the sample app. Generate the project with `xcodegen`
# (the `test:ios` devenv script does this for you).
name: CanvistExample
options:
  bundleIdPrefix: io.github.ifiokjr.canvist
  deploymentTarget:
    iOS: "18.0"
packages:
  Canvist:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  CanvistExample:
    type: application
    platform: iOS
    sources: [CanvistExample]
    dependencies:
      - package: Canvist
    # Dictation goes through a relay when both are set, for example with
    # `xcodebuild CANVIST_DICTATION_URL=wss://… CANVIST_DICTATION_TOKEN=…`.
    # The token is for trying a relay out; a real app fetches a short-lived
    # one from its own server.
    info:
      path: CanvistExample/Info.plist
      properties:
        CanvistDictationURL: $(CANVIST_DICTATION_URL)
        CanvistDictationToken: $(CANVIST_DICTATION_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ifiokjr.canvist.example
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Canvist
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictation listens to the microphone to turn your speech into text.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Dictation recognizes your speech on this device to turn it into text.
        CANVIST_DICTATION_URL: ""
        CANVIST_DICTATION_TOKEN: ""
  CanvistExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CanvistExampleUITests]
    dependencies:
      - target: CanvistExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ifiokjr.canvist.example.uitests
        GENERATE_INFOPLIST_FILE: true
schemes:
  CanvistExample:
    build:
      targets:
        CanvistExample: all
    test:
      targets: [CanvistExampleUITests]
