name: canvist_flutter
description: canvist's rich-text editor for Flutter, painted from a Rust layout. Typed extension commands, IME and touch selection, accessibility, and Yjs collaboration.
version: 0.2.0
repository: https://github.com/canvist/canvist/tree/main/platforms/flutter
issue_tracker: https://github.com/canvist/canvist/issues
topics:
  - rich-text
  - editor
  - text-editor
  - collaboration

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  canvist: ^0.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
