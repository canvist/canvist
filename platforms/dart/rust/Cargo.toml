# This crate ships inside the `canvist` pub.dev package, whose build hook
# compiles it in the pub cache, outside this repository. So it inherits nothing
# from the Cargo workspace and names the canvist crates by their crates.io
# release: monochange pins `canvist_headless` and `canvist_layout` to the
# version every release publishes, and the workspace's `[patch.crates-io]`
# builds the local sources instead whenever it is compiled here.
[package]
name = "canvist_dart"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
homepage = "https://github.com/canvist/canvist"
license = "Unlicense"
publish = false
repository = "https://github.com/canvist/canvist"
rust-version = "1.95.0"
description = "flutter_rust_bridge adapter that exposes canvist_headless to the pure Dart `canvist` package"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
canvist_headless = { version = "=0.2.0", default-features = false, features = ["collab", "full", "journal", "ssr"] }
canvist_layout = { version = "=0.2.0", default-features = false, features = ["editor", "ink", "kinetic", "tables", "theme-extensions"] }
flutter_rust_bridge = { version = "=2.13.0" }
serde_json = { version = "^1", default-features = false, features = ["std"] }
unicode-segmentation = { version = "^1", default-features = false }

# The workspace's lints, which a standalone manifest cannot inherit.
[lints.rust]
unsafe_code = "deny"
unstable_features = "deny"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
