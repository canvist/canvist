[package]
name = "canvist_dictation_relay"
version.workspace = true
authors.workspace = true
categories = ["multimedia::audio", "network-programming", "web-programming::websocket"]
edition.workspace = true
homepage.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md", "license"]
keywords = ["dictation", "speech-to-text", "websocket", "relay", "text-editor"]
license.workspace = true
publish = false
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The canvist dictation relay: streams speech from clients to speech-to-text providers, with an optional language-model polish"

[[bin]]
name = "canvist-dictation"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "query", "tokio", "ws"] }
base64 = { workspace = true, features = ["std"] }
canvist_dictation = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
hmac = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "std"] }

[dev-dependencies]
axum = { workspace = true, features = ["json"] }

[lints]
workspace = true
