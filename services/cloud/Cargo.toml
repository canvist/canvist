[package]
name = "canvist_cloud"
version = "0.1.1"
authors.workspace = true
categories = ["text-editors", "network-programming", "web-programming::websocket"]
edition.workspace = true
homepage.workspace = true
include = ["src/**/*.rs", "migrations/*.sql", "Cargo.toml", "readme.md", "license"]
keywords = ["text-editor", "collaboration", "yjs", "websocket", "crdt"]
license.workspace = true
publish = false
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "canvist Cloud: a multi-tenant y-sync relay with persistence, metering, and document conversion"

[[bin]]
name = "canvist-cloud"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = { workspace = true, features = ["std"] }
canvist_collab = { workspace = true }
canvist_headless = { workspace = true, features = ["collab", "starter-kit"] }
deadpool-postgres = { workspace = true, features = ["rt_tokio_1"] }
futures-util = { workspace = true, features = ["sink", "std"] }
getrandom = { workspace = true, features = ["std"] }
hmac = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["runtime"] }
tokio-util = { workspace = true, features = ["rt"] }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "std"] }
yrs = { workspace = true, features = ["sync"] }

[dev-dependencies]
hmac = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
