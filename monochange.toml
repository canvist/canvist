# :schema https://monochange.github.io/monochange/schemas/monochange.schema.json

# monochange plans canvist's releases. Two release units move independently:
#
# - `sdk`: every library canvist ships (Rust crates, the npm package, the
#   Dart and Flutter packages, and the Swift and Android bindings). They share
#   one Cargo workspace version and one conformance suite, so they release in
#   lockstep under tags like `v0.2.0`.
# - `app`: the product people use (the website and canvist Cloud). It deploys
#   to Railway and owns the user-facing changelog that the website renders at
#   `/changelog`.
#
# Run `mc check` to lint config and changesets, `mc preview` to see the next
# release, and `mc help` for the commands defined at the bottom of this file.

[defaults]
parent_bump = "patch"
include_private = false
warn_on_group_mismatch = true
package_type = "cargo"

[defaults.changelog]
path = "{{ path }}/changelog.md"
format = "keep_a_changelog"
initial_header = """
All notable changes to this project will be documented in this file.
This changelog is managed by [monochange](https://github.com/monochange/monochange).
"""

# =============================================================================
# Changelog streams, sections and types
# =============================================================================

[changelog]
templates = [
	"#### {{ summary }}\n\n{{ details }}\n\n{{ context }}",
	"#### {{ summary }}\n\n{{ context }}",
	"#### {{ summary }}\n\n{{ details }}",
	"- {{ summary }}",
]

[changelog.style]
metadata_style = "inline"

# The `default` stream (developer notes) always exists. `user` is the product
# changelog: the only stream the website reads.
[changelog.streams.user]
description = "What changed for people who use canvist: the editor they type in, the website, canvist Cloud, and their plan and price. Never deployment, CI, credentials, APIs, or internal maintenance."

[changelog.sections]
breaking = { heading = "💥 Breaking Change", description = "Breaking changes that require consumer updates or migration", priority = 10 }
feat = { heading = "🚀 Feature", description = "New features, enhancements, and additions", priority = 20 }
change = { heading = "📝 Changed", description = "Changes to existing behavior, functionality, or API semantics", priority = 25 }
fix = { heading = "🐛 Fixed", description = "Bug fixes and error corrections", priority = 30 }
test = { heading = "🧪 Testing", description = "Test suite improvements and additions", priority = 40 }
refactor = { heading = "🔨 Refactor", description = "Code refactoring with no functional changes", priority = 40 }
docs = { heading = "📖 Documentation", description = "Documentation updates and improvements", priority = 40 }
security = { heading = "🔒 Security", description = "Security vulnerabilities, patches, and hardening", priority = 40 }
perf = { heading = "⚡ Performance", description = "Performance optimizations and improvements", priority = 40 }
other = { heading = "📦 Other", description = "Miscellaneous changes not categorized elsewhere", priority = 50 }
user_pricing = { heading = "Plans and pricing", description = "Changes to plans, prices, limits, or billing that people see", priority = 10 }
user_changed = { heading = "Changed", description = "Things that work differently now", priority = 15 }
user_new = { heading = "New", description = "Things people can do that they could not before", priority = 20 }
user_fixed = { heading = "Fixed", description = "Problems people ran into that no longer happen", priority = 30 }

[changelog.section_thresholds]
collapse = 40
ignored = 45

[changelog.types]
# Developer stream (`default`): API contracts, packaging, deployment, CI and
# maintenance. These never reach the website.
major = { bump = "major", section = "breaking", description = "Major version bump including breaking API changes requiring migration" }
breaking = { bump = "major", section = "breaking", description = "Breaking changes that require consumers to update their code" }
minor = { bump = "minor", section = "feat", description = "Minor version bump including new features and enhancements" }
feat = { bump = "minor", section = "feat", description = "New functionality or capabilities added to the package" }
change = { bump = "minor", section = "change", description = "Changes to existing behavior or API semantics" }
patch = { bump = "patch", section = "fix", description = "Patch version bump for bug fixes and small corrections" }
fix = { bump = "patch", section = "fix", description = "Bug fixes and error corrections" }
refactor = { bump = "patch", section = "refactor", description = "Internal code restructuring without changing external behavior" }
test = { bump = "none", section = "test", description = "Additions or improvements to the test suite only" }
docs = { bump = "none", section = "docs", description = "Documentation updates and clarifications only" }
security = { bump = "none", section = "security", description = "Security improvements, advisories, and vulnerability fixes" }
perf = { bump = "none", section = "perf", description = "Performance and benchmarking improvements" }
none = { bump = "none", section = "other", description = "Changes with no version impact such as tooling or formatting" }
# User stream (`user`): plain product language for the website's changelog.
# Target the `app` group; the SDK has no user-facing output.
user_feature = { bump = "minor", section = "user_new", stream = "user", description = "Something people can now do in canvist, on the website, or in canvist Cloud" }
user_fix = { bump = "patch", section = "user_fixed", stream = "user", description = "A problem people ran into that no longer happens" }
user_change = { bump = "minor", section = "user_changed", stream = "user", description = "Something that works differently now, which people may need to adjust to" }
pricing = { bump = "minor", section = "user_pricing", stream = "user", description = "A change to plans, prices, included usage, limits, or billing" }

# The website's changelog: one JSON file per app release, user stream only.
# `website/src/content.config.ts` loads these files into the `changelog`
# collection that `/changelog` renders.
[changelog.outputs.website]
stream = "user"
targets = ["app"]
path = "website/src/content/changelog/{{ version }}.json"
format = "json"
mode = "release"

# Developer notes for the app. Nothing on the website reads this file.
[changelog.outputs.app_developer]
stream = "default"
targets = ["app"]
path = "website/developer-changelog.md"
format = "keep_a_changelog"
mode = "append"
initial_header = """
# canvist app: developer changelog

Deployment, infrastructure, and implementation notes for the website and canvist Cloud. The user-facing changelog lives at `/changelog` on the website.
"""

