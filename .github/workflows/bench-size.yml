name: "bench"

# `bench / bundle size` stays as a check name. It used to build every artifact
# and compare it with the base; that build dominated pull-request time and no
# longer runs. The job reports success so a required check still completes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: bench-size-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  size:
    name: bundle size
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: bundle size is not measured in CI
        run: echo "Bundle size is not compared in CI. Measure locally with tools/bench/size.ts."
