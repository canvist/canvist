name: publish

# Publishes one release tag. `release-pr.yml` dispatches it:
#
# - for real, on each tag after the release pull request merges: `v<version>`
#   for the SDK, `app/v<version>` for the website (and canvist Cloud);
# - as a dry run, against the release pull request's branch, every time that
#   pull request is refreshed.
#
# Pull requests that change a changeset, a package manifest, or the release
# pipeline also run it as a dry run, on a simulated release commit, so a
# publish is known to work before the release pull request exists. A dry run
# builds every artifact, runs each registry's own dry run, and checks what
# would ship (readiness, tarball contents, the crate graph), but publishes,
# uploads, and deploys nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v0.2.0 or app/v0.2.0."
        required: true
        type: string
      dry_run:
        description: "Build and validate everything, but publish nothing."
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: "Ref to check out instead of the tag (dry runs against the release pull request's branch)."
        required: false
        type: string
  pull_request:
    paths:
      - ".changeset/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/release-pr.yml"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "monochange.toml"
      - "packages/*/package.json"
      - "packages/canvist-headless/deno.json"
      - "platforms/dart/pubspec.yaml"
      - "platforms/flutter/pubspec.yaml"
      - "tools/release/check_npm_pack.ts"
      - "platforms/android/**/*.gradle.kts"
      - "platforms/android/gradle.properties"
      - "platforms/android/gradle/libs.versions.toml"
      - "platforms/apple/build.sh"
      - "services/cloud/Dockerfile"
      - "website/Dockerfile"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  # Never cancel a publish midway: a partial registry publish is worse than a
  # queued run.
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || 'pull-request' }}
  DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}

jobs:
  plan:
    name: plan
    if: github.repository_owner == 'canvist'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.plan.outputs.sdk }}
      app: ${{ steps.plan.outputs.app }}
      dry_run: ${{ env.DRY_RUN }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: choose jobs for the tag
        id: plan
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ]; then
            if [ -n "$CHECKOUT_REF" ]; then
              echo "::error::checkout_ref is only allowed for dry runs." >&2
              exit 1
            fi
            git check-ref-format "refs/tags/$RELEASE_TAG"
            if [ "$RELEASE_TAG" = "pull-request" ]; then
              echo "::error::Real publication requires a release tag." >&2
              exit 1
            fi
          fi
          case "$RELEASE_TAG" in
            pull-request) echo "sdk=true" >> "$GITHUB_OUTPUT"; echo "app=true" >> "$GITHUB_OUTPUT" ;;
            app/v*) echo "sdk=false" >> "$GITHUB_OUTPUT"; echo "app=true" >> "$GITHUB_OUTPUT" ;;
            v*) echo "sdk=true" >> "$GITHUB_OUTPUT"; echo "app=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown release tag '$RELEASE_TAG'." >&2; exit 1 ;;
          esac

      # Resolve the source once in a read-only job, before any repository code
      # runs or any job obtains publication credentials.
      - name: checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DRY_RUN == 'true' && (inputs.checkout_ref || inputs.tag || github.event.pull_request.head.sha) || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: resolve and verify the release commit
        id: source
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ "$DRY_RUN" != "true" ]; then
            git fetch --force --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$sha" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # crates.io and npm through monochange, then JSR, all with OIDC trusted
  # publishing: no registry token is stored anywhere.
  packages:
    name: crates.io, npm, and JSR
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'publisher' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # npm trusted publishing needs npm 11.5 or newer. No `registry-url`: it
      # writes an `.npmrc` that authenticates with `NODE_AUTH_TOKEN`, which
      # trusted publishing must not see.
      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # A pull request has no release commit yet: make one locally, exactly
      # as the release pull request would, so the dry run checks the versions
      # and manifests that would ship.
      - name: simulate the release commit
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mc run release --commit --no-verify=true --format text
        shell: devenv shell -- bash -e {0}

      # The same toolchain as `headless-js.yml`: the build uses `wasm-pack
      # --profile`, which devenv's wasm-pack is too old for.
      - name: install the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack

      # Each npm package ships its build output, and publishing runs with
      # `NPM_CONFIG_IGNORE_SCRIPTS`, so no `prepack` builds them: build here,
      # in dependency order. The local `file:` links in the lockfiles satisfy
      # the release's `^<version>` ranges, so `npm ci` needs nothing that isn't
      # published yet.
      - name: build @canvist/headless
        working-directory: packages/canvist-headless
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:wasm
          npm run build

      - name: build @canvist/web
        working-directory: packages/canvist-web
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:wasm
          npm run build

      - name: build @canvist/react and @canvist/vue
        run: |
          set -euo pipefail
          for package in packages/canvist-react packages/canvist-vue; do
            (cd "$package" && npm ci --no-audit --no-fund && npm run build)
          done

      - name: build @canvist/canvas
        working-directory: packages/canvist-canvas
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:wasm
          npm run build

      - name: check every npm tarball has what its exports name
        run: |
          node tools/release/check_npm_pack.ts \
            packages/canvist-headless packages/canvist-web packages/canvist-react packages/canvist-vue packages/canvist-canvas

      # Readiness reads the release record: every package must be publishable,
      # with its registry's trusted publishing set up. The Dart packages are
      # monochange `external` (the `pub` job publishes them once crates.io has
      # the crates they build from), so they report `unsupported` and are left
      # out.
      - name: check publish readiness
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/publish-readiness.json"
          mc step publish-readiness --from HEAD --output "$result" --format json
          jq -e '
            [.packages[] | select(.registry != "pub_dev")] as $packages
            | ($packages | length > 0) and all($packages[]; .status == "ready")
          ' "$result" >/dev/null || {
            echo "::error::Not every package is ready to publish." >&2
            jq -r '.packages[] | "\(.status)\t\(.registry)\t\(.package)"' "$result" >&2
            exit 1
          }
        shell: devenv shell -- bash -e {0}

      # monochange's own dry run cannot resolve a crate whose workspace
      # dependency is unpublished at the release version, so it only plans
      # those. Cargo packages all nine together against a local registry, which
      # proves each crate builds from its packaged sources.
      - name: package every crate together
        if: needs.plan.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          # Readiness names packages by their monochange id, which is not
          # always the crate name (`canvist-rust` publishes `canvist`), so
          # resolve each id through its `path` in monochange.toml.
          metadata=$(cargo metadata --no-deps --format-version 1)
          crates=()
          for id in $(jq -r '.packages[] | select(.registry == "crates_io") | .package' "$RUNNER_TEMP/publish-readiness.json"); do
            crate_path=$(awk -v id="$id" '
              $0 == "[package." id "]" || $0 == "[package.\"" id "\"]" { found = 1; next }
              found && /^path *=/ { gsub(/^path *= *"|"$/, ""); print; exit }
              found && /^\[/ { exit }
            ' monochange.toml)
            name=$(jq -r --arg manifest "$PWD/$crate_path/Cargo.toml" '.packages[] | select(.manifest_path == $manifest) | .name' <<<"$metadata")
            [ -n "$name" ] || { echo "::error::no crate found for monochange package $id" >&2; exit 1; }
            crates+=(-p "$name")
          done
          cargo publish --dry-run --locked "${crates[@]}"
        shell: devenv shell -- bash -e {0}

      # Fetched last, right before publishing: the token lasts 30 minutes.
      - name: get a crates.io token through OIDC
        if: needs.plan.outputs.dry_run != 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@v1

      - name: publish crates and npm packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          # Trusted publishing refuses a long-lived npm token.
          unset NODE_AUTH_TOKEN
          args=(step publish-packages --all --output "$RUNNER_TEMP/publish-result.json" --format json)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            # monochange checks the job runs in the `publisher` environment the
            # registries trust. Actions does not expose the environment name,
            # and the job's `environment:` is an expression monochange cannot
            # evaluate from the workflow file, so name it here.
            export MONOCHANGE_TRUSTED_PUBLISHING_ENVIRONMENT=publisher
          fi
          mc --log-level=info "${args[@]}" | tee "$RUNNER_TEMP/publish-packages.json"
        shell: devenv shell -- bash -e {0}

      # The dry run must cover exactly the packages readiness approved, and
      # none may fail. Workspace crates whose dependencies are not published
      # yet stay `planned`; the real publish orders them.
      - name: check the dry run covers every package
        if: needs.plan.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          jq -s -e '
            ([.[0].packages[] | select(.registry != "pub_dev") | .package] | sort) ==
              ([.[1].package_publish.packages[]
                | select(.status != "skipped_external" and .status != "skipped_existing")
                | .package] | sort)
            and .[1].package_publish.summary.failed == 0
            and .[1].package_publish.summary.blocked == 0
          ' "$RUNNER_TEMP/publish-readiness.json" "$RUNNER_TEMP/publish-packages.json" >/dev/null || {
            echo "::error::The publish dry run does not match readiness, or a package failed." >&2
            jq '.package_publish.summary' "$RUNNER_TEMP/publish-packages.json" >&2
            exit 1
          }

      # The current Deno, as `headless-js.yml` uses: devenv's is older and
      # fails JSR's slow-type checks that current releases pass.
      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: publish @canvist/headless to JSR
        working-directory: packages/canvist-headless
        run: |
          set -euo pipefail
          deno --version
          if [ "$DRY_RUN" = "true" ]; then
            deno publish --dry-run --allow-dirty
          else
            deno publish
          fi

      - name: keep publish reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-reports
          path: ${{ runner.temp }}/publish-*.json
          if-no-files-found: ignore

  # The Swift package's binary: `CanvistFFI.xcframework.zip`, its SwiftPM
  # checksum, and the generated `Canvist.swift`, attached to the release.
  apple:
    name: Swift package
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: publish-apple

      - name: build CanvistFFI.xcframework
        run: platforms/apple/build.sh

      - name: package the binary target
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apple"
          mkdir -p "$out"
          (cd platforms/apple/Frameworks && zip -qry "$out/CanvistFFI.xcframework.zip" CanvistFFI.xcframework)
          swift package compute-checksum "$out/CanvistFFI.xcframework.zip" > "$out/CanvistFFI.xcframework.zip.checksum"
          cp platforms/apple/Sources/Canvist/Canvist.swift "$out/Canvist.swift"
          ls -l "$out"
          cat "$out/CanvistFFI.xcframework.zip.checksum"

      - name: stage release assets
        if: needs.plan.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apple-release-assets
          path: ${{ runner.temp }}/apple/*
          if-no-files-found: error

  # Grant release write access only after the verified source has been built.
  apple-release:
    name: attach Swift package to the release
    needs: [plan, apple]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publisher
    permissions:
      contents: write
    steps:
      - name: download release assets
        uses: actions/download-artifact@v4
        with:
          name: apple-release-assets
          path: ${{ runner.temp }}/apple

      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/apple/* --clobber --repo "$GITHUB_REPOSITORY"

  # The Android library on Maven Central as `io.github.ifiokjr:canvist-android`.
  # Until `CANVIST_PUBLISH_MAVEN_CENTRAL` is `true` (it needs the Central
  # Portal and signing secrets), releases publish to the job's local Maven
  # repository only, which validates the publication.
  android:
    name: Android library
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ needs.plan.outputs.dry_run != 'true' && vars.CANVIST_PUBLISH_MAVEN_CENTRAL == 'true' && 'publisher' || '' }}
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: publish-android

      - name: install cargo-run-bin
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-run-bin

      - name: build the android library
        run: platforms/android/build.sh

      - name: publish to the local maven repository
        if: needs.plan.outputs.dry_run == 'true' || vars.CANVIST_PUBLISH_MAVEN_CENTRAL != 'true'
        working-directory: platforms/android
        run: ./gradlew :canvist:publishToMavenLocal

      - name: publish to maven central
        if: needs.plan.outputs.dry_run != 'true' && vars.CANVIST_PUBLISH_MAVEN_CENTRAL == 'true'
        working-directory: platforms/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :canvist:publishAndReleaseToMavenCentral --no-configuration-cache

  # pub.dev, after crates.io: the `canvist` archive's build hook compiles
  # its Rust crate from the crates.io release it pins, so that release must
  # exist first. monochange marks both Dart packages `external` and this job
  # publishes them. `dart.yml` proves on every pull request that both archives
  # validate and that `canvist` builds outside the workspace. Turn the job on
  # by setting the `CANVIST_PUBLISH_PUB_DEV` repository variable to `true`.
  pub:
    name: pub.dev
    needs: [plan, packages]
    if: needs.plan.outputs.sdk == 'true' && vars.CANVIST_PUBLISH_PUB_DEV == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'publisher' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: platforms/flutter/.fvmrc

      # Requests the pub.dev OIDC token for this tagged run.
      - name: setup dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: publish canvist, then canvist_flutter
        run: |
          set -euo pipefail
          flag="--force"
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          (cd platforms/dart && dart pub publish "$flag")
          (cd platforms/flutter && flutter pub publish "$flag")

  # Railway deploys the app itself: staging follows `main`, and production
  # follows the `production` branch, which the `release` job moves once an
  # `app/v*` tag has shipped. The dry run builds the images Railway would
  # build: the website, and canvist Cloud's one image for `sync` and
  # `convert`. A real run has nothing to build and skips this job.
  deploy:
    name: build the ${{ matrix.service }} image
    needs: plan
    if: needs.plan.outputs.app == 'true' && needs.plan.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: website
            dockerfile: website/Dockerfile
          - service: cloud
            dockerfile: services/cloud/Dockerfile
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: build the image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "canvist-${{ matrix.service }}:dry-run" .

  # Publish the drafted GitHub release once everything for its tag shipped,
  # and for an `app/v*` tag, deploy it to production first.
  release:
    name: publish the GitHub release
    needs: [plan, packages, apple, apple-release, android, pub, deploy]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.dry_run != 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publisher
    permissions:
      contents: write
    steps:
      # Railway deploys production from the `production` branch, so moving it
      # to the release commit is the production deploy. It runs only after
      # every other job for the tag succeeded, and before the draft is
      # published, so a failed deploy leaves the release a draft. Only
      # fast-forwards: an older release run after a newer one leaves the
      # branch alone, and a branch that has diverged fails the release
      # instead of being overwritten.
      - name: move production to the release
        if: needs.plan.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          if ! gh api "$api/git/ref/heads/production" > /dev/null 2>&1; then
            gh api -X POST "$api/git/refs" -f ref=refs/heads/production -f sha="$SHA" > /dev/null
            echo "Created production at $SHA"
            exit 0
          fi
          status="$(gh api "$api/compare/production...$SHA" --jq .status)"
          case "$status" in
            ahead)
              gh api -X PATCH "$api/git/refs/heads/production" -f sha="$SHA" -F force=false > /dev/null
              echo "Moved production to $SHA"
              ;;
            identical | behind) echo "production already contains $SHA" ;;
            *)
              echo "::error::production has diverged from $SHA ($status); fix the branch, then re-run this job." >&2
              exit 1
              ;;
          esac

      - name: publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="--latest=false"
          if [[ "$RELEASE_TAG" == v* ]]; then latest="--latest"; fi
          gh release edit "$RELEASE_TAG" --draft=false "$latest" --repo "$GITHUB_REPOSITORY"
