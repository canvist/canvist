name: publish

# Publishes one release tag. `release-pr.yml` dispatches it:
#
# - for real, on each tag after the release pull request merges: `v<version>`
#   for the SDK, `app/v<version>` for the website (and canvist Cloud);
# - as a dry run, against the release pull request's branch, every time that
#   pull request is refreshed.
#
# Pull requests that change a changeset, a package manifest, or the release
# pipeline also run it as a dry run, on a simulated release commit, so a
# publish is known to work before the release pull request exists. A dry run
# builds every artifact, runs each registry's own dry run, and checks what
# would ship (readiness, tarball contents, the crate graph), but publishes,
# uploads, and deploys nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v0.2.0 or app/v0.2.0."
        required: true
        type: string
      dry_run:
        description: "Build and validate everything, but publish nothing."
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: "Ref to check out instead of the tag (dry runs against the release pull request's branch)."
        required: false
        type: string
  pull_request:
    paths:
      - ".changeset/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/release-pr.yml"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "monochange.toml"
      - "packages/*/package.json"
      - "packages/*/deno.json"
      - "platforms/dart/pubspec.yaml"
      - "platforms/flutter/pubspec.yaml"
      - "tools/release/**"
      - "platforms/android/**/*.gradle.kts"
      - "platforms/android/gradle.properties"
      - "platforms/android/gradle/libs.versions.toml"
      - "platforms/apple/**"
      - "services/cloud/Dockerfile"
      - "website/Dockerfile"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  # Never cancel a real publish midway: a partial registry publish is worse
  # than a queued run. Pull-request dry runs can cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_TAG: ${{ inputs.tag || 'pull-request' }}
  DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}

jobs:
  plan:
    name: plan
    if: github.repository_owner == 'canvist'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.plan.outputs.sdk }}
      app: ${{ steps.plan.outputs.app }}
      dry_run: ${{ env.DRY_RUN }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: choose jobs for the tag
        id: plan
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ]; then
            if [ -n "$CHECKOUT_REF" ]; then
              echo "::error::checkout_ref is only allowed for dry runs." >&2
              exit 1
            fi
            git check-ref-format "refs/tags/$RELEASE_TAG"
            if [ "$RELEASE_TAG" = "pull-request" ]; then
              echo "::error::Real publication requires a release tag." >&2
              exit 1
            fi
          fi
          case "$RELEASE_TAG" in
            pull-request) echo "sdk=true" >> "$GITHUB_OUTPUT"; echo "app=true" >> "$GITHUB_OUTPUT" ;;
            app/v*) echo "sdk=false" >> "$GITHUB_OUTPUT"; echo "app=true" >> "$GITHUB_OUTPUT" ;;
            v*) echo "sdk=true" >> "$GITHUB_OUTPUT"; echo "app=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown release tag '$RELEASE_TAG'." >&2; exit 1 ;;
          esac

      # Resolve the source once in a read-only job, before any repository code
      # runs or any job obtains publication credentials.
      - name: checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DRY_RUN == 'true' && (inputs.checkout_ref || inputs.tag || github.event.pull_request.head.sha) || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: resolve and verify the release commit
        id: source
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ "$DRY_RUN" != "true" ]; then
            git fetch --force --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$sha" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Fail before any registry mutation when a native publishing credential is
  # missing. Dry runs do not require secrets or publisher approval.
  configuration:
    name: SDK publishing configuration
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'publisher' || '' }}
    steps:
      - name: require every native publishing credential
        if: needs.plan.outputs.dry_run != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
          SWIFTPM_GITHUB_TOKEN: ${{ secrets.SWIFTPM_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_SIGNING_KEY MAVEN_SIGNING_KEY_PASSWORD SWIFTPM_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configure $name in the publisher environment before releasing the SDK." >&2
              exit 1
            fi
          done

  # crates.io through monochange OIDC trusted publishing. Split from npm so
  # pub.dev can start as soon as crates exist (the Dart archive pins crates.io,
  # not npm). Android/Apple/npm stay parallel after configuration.
  crates:
    name: crates.io
    needs: [plan, configuration]
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'publisher' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: publish-crates

      - name: setup release tools
        uses: ./.github/actions/setup-tools
        with:
          monochange: true
          format: true

      - name: simulate the release commit
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mc run release --commit --no-verify=true --format text

      # Readiness for crates only. `already_published` is fine on resume.
      - name: check crates.io publish readiness
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/publish-readiness.json"
          mc step publish-readiness --from HEAD --output "$result" --format json ||
            echo "::warning::publish-readiness reported unsupported external packages; validating the report"
          jq -e '
            [.packages[] | select(.registry == "crates_io")] as $packages
            | ($packages | length > 0)
              and all($packages[]; .status == "ready" or .status == "already_published")
          ' "$result" >/dev/null || {
            echo "::error::Not every crate is ready to publish." >&2
            jq -r '.packages[] | select(.registry == "crates_io") | "\(.status)\t\(.package)"' "$result" >&2
            exit 1
          }
          already=$(jq -r '.packages[] | select(.registry == "crates_io" and .status == "already_published") | "\(.package)\t\(.version)"' "$result")
          if [ -n "$already" ]; then
            echo "::notice::Resuming crates.io publish; already-published crates will be skipped:"
            printf '%s\n' "$already"
          fi

      - name: package every crate together
        if: needs.plan.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          crates=()
          for id in $(jq -r '.packages[] | select(.registry == "crates_io") | .package' "$RUNNER_TEMP/publish-readiness.json"); do
            crate_path=$(awk -v id="$id" '
              $0 == "[package." id "]" || $0 == "[package.\"" id "\"]" { found = 1; next }
              found && /^path *=/ { gsub(/^path *= *"|"$/, ""); print; exit }
              found && /^\[/ { exit }
            ' monochange.toml)
            name=$(jq -r --arg manifest "$PWD/$crate_path/Cargo.toml" '.packages[] | select(.manifest_path == $manifest) | .name' <<<"$metadata")
            [ -n "$name" ] || { echo "::error::no crate found for monochange package $id" >&2; exit 1; }
            crates+=(-p "$name")
          done
          cargo publish --dry-run --locked "${crates[@]}"

      - name: get a crates.io token through OIDC
        if: needs.plan.outputs.dry_run != 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@v1

      - name: publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          set -euo pipefail
          args=(step publish-packages --all --ecosystem cargo --output "$RUNNER_TEMP/publish-result.json" --format json)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            export MONOCHANGE_TRUSTED_PUBLISHING_ENVIRONMENT=publisher
          fi
          mc --log-level=info "${args[@]}" | tee "$RUNNER_TEMP/publish-packages.json"

      - name: check the crates dry run covers every package
        if: needs.plan.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          jq -s -e '
            ([.[0].packages[]
              | select(.registry == "crates_io" and .status != "already_published")
              | .package] | sort) ==
              ([.[1].package_publish.packages[]
                | select(.status != "skipped_external" and .status != "skipped_existing")
                | .package] | sort)
            and .[1].package_publish.summary.failed == 0
            and .[1].package_publish.summary.blocked == 0
          ' "$RUNNER_TEMP/publish-readiness.json" "$RUNNER_TEMP/publish-packages.json" >/dev/null || {
            echo "::error::The crates dry run does not match readiness, or a package failed." >&2
            jq '.package_publish.summary' "$RUNNER_TEMP/publish-packages.json" >&2
            exit 1
          }

      - name: keep crates publish reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-reports-crates
          path: ${{ runner.temp }}/publish-*.json
          if-no-files-found: ignore

  # npm through monochange OIDC trusted publishing. Parallel with crates,
  # Android, and Apple after configuration; pub.dev does not wait on this job.
  npm:
    name: npm
    needs: [plan, configuration]
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'publisher' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: publish-npm

      - name: setup release tools
        uses: ./.github/actions/setup-tools
        with:
          monochange: true
          format: true

      # npm trusted publishing needs npm 11.5.1 or newer and Node 22.14 or
      # newer. No `registry-url`: it writes an `.npmrc` that authenticates with
      # `NODE_AUTH_TOKEN`, which trusted publishing must not see. Disable
      # caching per npm's trusted publishing guidance.
      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: simulate the release commit
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mc run release --commit --no-verify=true --format text

      - name: install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.15.0

      - name: build and validate the web SDK
        run: bash tools/release/build_web.sh

      - name: build and validate React Native and Lynx packages
        run: bash tools/release/build_native_js.sh

      - name: check npm publish readiness
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/publish-readiness.json"
          mc step publish-readiness --from HEAD --output "$result" --format json ||
            echo "::warning::publish-readiness reported unsupported external packages; validating the report"
          jq -e '
            [.packages[] | select(.registry == "npm")] as $packages
            | ($packages | length > 0)
              and all($packages[]; .status == "ready" or .status == "already_published")
          ' "$result" >/dev/null || {
            echo "::error::Not every npm package is ready to publish." >&2
            jq -r '.packages[] | select(.registry == "npm") | "\(.status)\t\(.package)"' "$result" >&2
            exit 1
          }
          already=$(jq -r '.packages[] | select(.registry == "npm" and .status == "already_published") | "\(.package)\t\(.version)"' "$result")
          if [ -n "$already" ]; then
            echo "::notice::Resuming npm publish; already-published packages will be skipped:"
            printf '%s\n' "$already"
          fi

      # Verify every client-side condition npm's OIDC flow depends on (minimum
      # Node/npm versions, no static auth tokens or auth-bearing .npmrc,
      # GitHub OIDC endpoint variables, and exact package.json repository URLs)
      # and warn when a ready package has never completed a trusted publish and
      # is older than npm's 48-hour unvalidated trusted-publisher expiry window.
      - name: verify npm trusted publishing setup
        env:
          REQUIRE_OIDC: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          READINESS_REPORT: ${{ runner.temp }}/publish-readiness.json
        run: |
          set -euo pipefail
          version_ge() {
            local a="${1#v}" b="${2#v}"
            a="${a%%-*}"
            b="${b%%-*}"
            local IFS=.
            local -a av bv
            read -r -a av <<<"$a"
            read -r -a bv <<<"$b"
            for i in 0 1 2; do
              local ai="${av[i]:-0}" bi="${bv[i]:-0}"
              if ((10#$ai > 10#$bi)); then return 0; fi
              if ((10#$ai < 10#$bi)); then return 1; fi
            done
            return 0
          }

          node_version="$(node --version)"
          npm_version="$(npm --version)"
          if ! version_ge "$node_version" "22.14.0"; then
            echo "::error::npm trusted publishing requires Node >= 22.14.0 (found $node_version)." >&2
            exit 1
          fi
          if ! version_ge "$npm_version" "11.5.1"; then
            echo "::error::npm trusted publishing requires npm >= 11.5.1 (found $npm_version)." >&2
            exit 1
          fi

          forbidden_env="$(jq -rn '
            env | to_entries[]
            | select((.value // "") != "")
            | .key as $k
            | ($k | ascii_downcase) as $l
            | select(
                $k == "NODE_AUTH_TOKEN"
                or $k == "NPM_TOKEN"
                or $k == "NPM_CONFIG__AUTH_TOKEN"
                or $k == "npm_config__authToken"
                or $k == "NPM_CONFIG_USERCONFIG"
                or $k == "npm_config_userconfig"
                or ($l | startswith("npm_config_") and contains("auth") and contains("token"))
              )
            | $k
          ')"
          if [ -n "$forbidden_env" ]; then
            echo "::error::Static npm auth/config variables must not be set for trusted publishing:" >&2
            printf '%s\n' "$forbidden_env" >&2
            exit 1
          fi

          # Plain-text `npm config list` exposes protected credential keys as
          # `(protected)` without revealing values, whereas `--json` omits them.
          auth_config="$(npm config list | grep -E '^[[:space:]]*[^;#].*(:_authToken|:_auth|:_password|:certfile|:keyfile|^_authToken|^_auth|^_password)[[:space:]]*=' || true)"
          if [ -n "$auth_config" ]; then
            echo "::error::Static npm credentials are configured in .npmrc; trusted publishing must not see them:" >&2
            printf '%s\n' "$auth_config" >&2
            exit 1
          fi

          package_npmrc="$(find packages -path '*/node_modules' -prune -o -name '.npmrc' -print 2>/dev/null || true)"
          if [ -n "$package_npmrc" ]; then
            echo "::error::Unexpected package-level .npmrc file(s) found:" >&2
            printf '%s\n' "$package_npmrc" >&2
            exit 1
          fi

          registry="$(npm config get registry)"
          if [ "${registry%/}" != "https://registry.npmjs.org" ]; then
            echo "::error::Expected npm registry https://registry.npmjs.org/, found $registry." >&2
            exit 1
          fi

          if [ "${REQUIRE_OIDC:-false}" = "true" ]; then
            if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::error::GitHub Actions OIDC environment variables (GITHUB_ACTIONS, ACTIONS_ID_TOKEN_REQUEST_URL, ACTIONS_ID_TOKEN_REQUEST_TOKEN) are required for npm trusted publishing; check job permissions: id-token: write." >&2
              exit 1
            fi
          fi

          if [ ! -f "$READINESS_REPORT" ]; then
            echo "::error::Missing readiness report at $READINESS_REPORT." >&2
            exit 1
          fi

          ready_packages=()
          while IFS= read -r pkg; do
            [ -n "$pkg" ] && ready_packages+=("$pkg")
          done < <(jq -r '.packages[] | select(.registry == "npm" and .status == "ready") | .package' "$READINESS_REPORT")

          if [ "${ready_packages+set}" = "set" ]; then
            for pkg in "${ready_packages[@]}"; do
              pkg_path="$(awk -v id="$pkg" '
                $0 == "[package." id "]" || $0 == "[package.\"" id "\"]" { found = 1; next }
                found && /^path *=/ { gsub(/^path *= *"|"$/, ""); print; exit }
                found && /^\[/ { exit }
              ' monochange.toml)"
              if [ -z "$pkg_path" ] || [ ! -f "$pkg_path/package.json" ]; then
                echo "::error::No package.json found for monochange npm package $pkg ($pkg_path)." >&2
                exit 1
              fi
              repo_url="$(jq -r '.repository.url // (if (.repository | type) == "string" then .repository else "" end)' "$pkg_path/package.json")"
              if [ "$repo_url" != "git+https://github.com/canvist/canvist.git" ]; then
                echo "::error::$pkg ($pkg_path/package.json) repository.url is '$repo_url'; npm trusted publishing requires 'git+https://github.com/canvist/canvist.git'." >&2
                exit 1
              fi
            done
          fi

          if [ "${SKIP_REGISTRY_CHECK:-false}" != "true" ] && [ "${ready_packages+set}" = "set" ]; then
            unvalidated=()
            for pkg in "${ready_packages[@]}"; do
              if packument="$(curl -fsSL --retry 2 --retry-delay 1 --max-time 10 "${registry%/}/${pkg}" 2>/dev/null)"; then
                if jq -e '
                  ((.versions // {} | to_entries | any(.value._npmUser.trustedPublisher != null)) | not)
                  and ((.time.created // "") != "")
                  and ((now - (.time.created | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) > 172800)
                ' <<<"$packument" >/dev/null 2>&1; then
                  created="$(jq -r '.time.created' <<<"$packument")"
                  unvalidated+=("${pkg} (created ${created})")
                fi
              else
                echo "::warning::Could not inspect npm registry metadata for ${pkg}; skipping 48-hour trusted-publisher expiry check."
              fi
            done
            if [ "${unvalidated+set}" = "set" ]; then
              echo "::warning::${#unvalidated[@]} ready npm package(s) have never completed a trusted publish and were created more than 48 hours ago. npm expires unvalidated trusted publisher configurations 48 hours after creation (and \`npm trust list\` does not display expiry). Before a real publish, delete and recreate any expired configuration with \`--allow-publish\` (or on npmjs.com with direct \`npm publish\` enabled), then publish within 48 hours: ${unvalidated[*]}"
            fi
          fi

      - name: publish npm packages
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          # Surface npm's OIDC fetch and token-exchange diagnostics (which npm
          # logs only at http/verbose levels, hiding registry rejections behind
          # a bare ENEEDAUTH) and isolate this step's redacted debug logs.
          NPM_CONFIG_LOGLEVEL: "verbose"
          NPM_CONFIG_LOGS_DIR: ${{ runner.temp }}/npm-logs
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTH_TOKEN npm_config__authToken
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
            unset NPM_CONFIG_USERCONFIG
          fi
          mkdir -p "$NPM_CONFIG_LOGS_DIR"
          args=(step publish-packages --all --ecosystem npm --output "$RUNNER_TEMP/publish-result.json" --format json)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            export MONOCHANGE_TRUSTED_PUBLISHING_ENVIRONMENT=publisher
          fi
          mc --log-level=info "${args[@]}" | tee "$RUNNER_TEMP/publish-packages.json"

      - name: check the npm dry run covers every package
        if: needs.plan.outputs.dry_run == 'true'
        env:
          REQUIRE_OIDC: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          jq -s -e '
            ([.[0].packages[]
              | select(.registry == "npm" and .status != "already_published")
              | .package] | sort) ==
              ([.[1].package_publish.packages[]
                | select(.status != "skipped_external" and .status != "skipped_existing")
                | .package] | sort)
            and .[1].package_publish.summary.failed == 0
            and .[1].package_publish.summary.blocked == 0
          ' "$RUNNER_TEMP/publish-readiness.json" "$RUNNER_TEMP/publish-packages.json" >/dev/null || {
            echo "::error::The npm dry run does not match readiness, or a package failed." >&2
            jq '.package_publish.summary' "$RUNNER_TEMP/publish-packages.json" >&2
            exit 1
          }
          if [ "${REQUIRE_OIDC:-false}" = "true" ]; then
            jq -e '
              [.package_publish.packages[] | select(.status == "planned")] as $planned
              | all($planned[];
                  ((.stderr // "") | contains("audience=npm%3Aregistry.npmjs.org"))
                  and ((.stderr // "") | contains("/-/npm/v1/oidc/token/exchange/package/"))
                )
            ' "$RUNNER_TEMP/publish-packages.json" >/dev/null || {
              echo "::error::The npm dry run did not attempt the GitHub OIDC token exchange for every planned package." >&2
              jq -r '
                .package_publish.packages[]
                | select(.status == "planned")
                | select((((.stderr // "") | contains("audience=npm%3Aregistry.npmjs.org")) and ((.stderr // "") | contains("/-/npm/v1/oidc/token/exchange/package/"))) | not)
                | .package
              ' "$RUNNER_TEMP/publish-packages.json" >&2
              exit 1
            }
          fi

      - name: show npm OIDC diagnostics on failure
        if: failure()
        env:
          NPM_CONFIG_LOGS_DIR: ${{ runner.temp }}/npm-logs
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=("$NPM_CONFIG_LOGS_DIR"/*.log)
          if [ "${logs+set}" != "set" ]; then
            echo "No npm debug logs were written to $NPM_CONFIG_LOGS_DIR."
            exit 0
          fi
          # npm formats every log-file line through @npmcli/redact (redacting
          # npm_* tokens, URL credentials, and UUIDs) and never writes OIDC
          # JWTs; strip any JWT-shaped string defensively before printing.
          grep -h -E 'oidc|token/exchange|idtoken|ENEEDAUTH|E401|E403|E404|E422' "${logs[@]}" \
            | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/<redacted-jwt>/g' \
            | tail -n 200 || true

      # npm debug logs pass through @npmcli/redact (`lib/utils/format.js`) and
      # `lib/utils/oidc.js` never logs OIDC or exchanged registry tokens.
      - name: keep npm debug logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-npm-debug-logs
          path: ${{ runner.temp }}/npm-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: keep npm publish reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-reports-npm
          path: ${{ runner.temp }}/publish-*.json
          if-no-files-found: ignore

  # The Swift package's binary: `CanvistFFI.xcframework.zip`, its SwiftPM
  # checksum, and the generated `Canvist.swift`, attached to the release.
  apple:
    name: Swift package
    needs: [plan, configuration]
    if: needs.plan.outputs.sdk == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: publish-apple

      - name: verify Apple packaging logic
        run: python3 -m unittest discover -s tools/release -p 'package_apple_test.py' -v

      - name: build CanvistFFI.xcframework
        run: platforms/apple/build.sh

      - name: prepare installable SwiftPM package
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 tools/release/package_apple.py --output "$RUNNER_TEMP/apple" --version "$version" --source-sha "$SOURCE_SHA"
          swift package dump-package --package-path "$RUNNER_TEMP/apple/swift-package" > /dev/null
          test "$(swift package compute-checksum "$RUNNER_TEMP/apple/assets/CanvistFFI.xcframework.zip")" = "$(cat "$RUNNER_TEMP/apple/assets/CanvistFFI.xcframework.zip.checksum")"

      - name: stage release assets
        if: needs.plan.outputs.dry_run != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-release-assets
          path: ${{ runner.temp }}/apple/
          include-hidden-files: true
          if-no-files-found: error

  # Grant release write access only after the verified source has been built.
  apple-release:
    name: publish SwiftPM
    needs: [plan, apple]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    environment: publisher
    permissions:
      contents: write
    steps:
      # Publishing scripts come from the workflow revision, not the release
      # tag: post-tag fixes (for example dropping CocoaPods) must apply to
      # already-cut tags. Built Apple assets still come from the tag job.
      - name: checkout publishing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-release-assets
          path: ${{ runner.temp }}/apple

      - name: publish Apple distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTPM_GITHUB_TOKEN: ${{ secrets.SWIFTPM_GITHUB_TOKEN }}
        run: bash tools/release/publish_apple.sh "$RUNNER_TEMP/apple"

  # The Android library on Maven Central as `io.github.ifiokjr:canvist-android`.
  # Dry runs validate Maven Local; real SDK releases require Central credentials
  # and signing and must never succeed with only a local publication.
  android:
    name: Android library
    needs: [plan, configuration]
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'publisher' || '' }}
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: setup java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: setup gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: publish-android

      # Pinned to workspace.metadata.bin. cargo-binstall's anonymous GitHub
      # API calls were rate-limited (403) from this job; install-action
      # downloads the release with the workflow token.
      - name: install cargo-ndk
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-ndk@4.1.2

      - name: build the android library
        run: platforms/android/build.sh

      - name: publish to the local maven repository
        if: needs.plan.outputs.dry_run == 'true'
        working-directory: platforms/android
        run: ./gradlew :canvist:publishToMavenLocal

      - name: publish to maven central
        if: needs.plan.outputs.dry_run != 'true'
        working-directory: platforms/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Maven Central username is required}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Maven Central password is required}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?Maven signing key is required}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:?Maven signing password is required}"
          # Maven Central rejects re-uploads of an existing version. Skip when
          # this tag is already live so a resume after a partial publish can
          # finish the remaining registries.
          version="${RELEASE_TAG#v}"
          pom="https://repo1.maven.org/maven2/io/github/ifiokjr/canvist-android/${version}/canvist-android-${version}.pom"
          if curl -fsSIL --retry 3 --retry-delay 2 "$pom" >/dev/null; then
            echo "::notice::io.github.ifiokjr:canvist-android:${version} already exists on Maven Central; skipping upload"
            exit 0
          fi
          ./gradlew :canvist:publishAndReleaseToMavenCentral --no-configuration-cache

  # pub.dev, after crates.io only: the `canvist` archive's build hook compiles
  # its Rust crate from the crates.io release it pins. It does not need npm,
  # so this job no longer waits on the wasm/npm publish path.
  pub:
    name: pub.dev
    needs: [plan, crates]
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'publisher' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: .fvmrc

      # Requests the pub.dev OIDC token for this tagged run.
      - name: setup dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      # The extensions re-export from `canvist`, so publish them after it.
      - name: publish canvist, canvist_extensions, then canvist_flutter
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          publish_package() {
            local dir="$1" pkg="$2" tool="$3"
            if [ "$DRY_RUN" = "true" ]; then
              (cd "$dir" && "$tool" pub publish --dry-run)
              return
            fi
            # pub.dev rejects re-uploads of an existing version. Skip when
            # this tag is already live so a resume after a partial publish can
            # finish the remaining registries (including when dispatched from main).
            local url="https://pub.dev/api/packages/${pkg}/versions/${version}"
            local status
            status="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ]; then
              echo "::notice::${pkg} ${version} already exists on pub.dev; skipping upload"
              return
            fi
            (cd "$dir" && "$tool" pub publish --force)
          }
          publish_package platforms/dart canvist dart
          publish_package platforms/dart_extensions canvist_extensions dart
          publish_package platforms/flutter canvist_flutter flutter

  # Railway deploys the app itself: staging follows `main`, and production
  # follows the `production` branch, which the `release` job moves once an
  # `app/v*` tag has shipped. The dry run builds the images Railway would
  # build: the website, and canvist Cloud's one image for `sync` and
  # `convert`. A real run has nothing to build and skips this job.
  deploy:
    name: build the ${{ matrix.service }} image
    needs: plan
    if: needs.plan.outputs.app == 'true' && needs.plan.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: website
            dockerfile: website/Dockerfile
          - service: cloud
            dockerfile: services/cloud/Dockerfile
    steps:
      - name: checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: build the image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "canvist-${{ matrix.service }}:dry-run" .

  # Publish the drafted GitHub release once everything for its tag shipped,
  # and for an `app/v*` tag, deploy it to production first.
  release:
    name: publish the GitHub release
    needs: [
      plan,
      configuration,
      crates,
      npm,
      apple,
      apple-release,
      android,
      pub,
      deploy,
    ]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.dry_run != 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publisher
    permissions:
      contents: write
    steps:
      # Railway deploys production from the `production` branch, so moving it
      # to the release commit is the production deploy. It runs only after
      # every other job for the tag succeeded, and before the draft is
      # published, so a failed deploy leaves the release a draft. Only
      # fast-forwards: an older release run after a newer one leaves the
      # branch alone, and a branch that has diverged fails the release
      # instead of being overwritten.
      - name: move production to the release
        if: needs.plan.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          if ! gh api "$api/git/ref/heads/production" > /dev/null 2>&1; then
            gh api -X POST "$api/git/refs" -f ref=refs/heads/production -f sha="$SHA" > /dev/null
            echo "Created production at $SHA"
            exit 0
          fi
          status="$(gh api "$api/compare/production...$SHA" --jq .status)"
          case "$status" in
            ahead)
              gh api -X PATCH "$api/git/refs/heads/production" -f sha="$SHA" -F force=false > /dev/null
              echo "Moved production to $SHA"
              ;;
            identical | behind) echo "production already contains $SHA" ;;
            *)
              echo "::error::production has diverged from $SHA ($status); fix the branch, then re-run this job." >&2
              exit 1
              ;;
          esac

      - name: publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="--latest=false"
          if [[ "$RELEASE_TAG" == v* ]]; then latest="--latest"; fi
          gh release edit "$RELEASE_TAG" --draft=false "$latest" --repo "$GITHUB_REPOSITORY"
