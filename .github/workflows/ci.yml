name: "ci"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
  # Every pull request, including stacked ones whose base is another
  # feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup rust
        uses: ./.github/actions/setup-rust

      - name: setup formatters and linters
        uses: ./.github/actions/setup-tools
        with:
          format: true
          lint: true

      - name: lint formatting
        run: dprint check

      - name: lint clippy
        # Warnings are errors so a crate cannot stay green here while another
        # job would have failed the same lint.
        run: cargo clippy --workspace --all-features --all-targets -- --deny warnings

      - name: lint code style
        run: tools/ci/lint-style.sh

      - name: lint kotlin
        run: git ls-files '*.kt' '*.kts' | grep -v 'platforms/flutter/example' | grep -v '\.generated\.kt$' | xargs ktlint

      - name: lint shell
        run: git ls-files '*.sh' | xargs shellcheck

  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: core-tests

      - name: unit tests for the public crates
        # The facade, the document model, the editor, and the headless engine.
        # Extension, desktop, collaboration, and binding suites stay in the
        # tree for local runs and are not part of this job.
        run: cargo test --locked -p canvist -p canvist_model -p canvist_core -p canvist_headless

  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build

      - name: build
        # `lint` already compiles every feature and target with clippy.
        run: cargo build --locked

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
