name: "docs"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - "docs/**"
      - "skills/**"
      - "crates/**"
      - "packages/canvist-headless/**"
      - "platforms/dart/**"
      - "platforms/flutter/**"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The docs' Rust samples run as doc tests in `ci` (`test:docs` covers the
# `canvist_book` crate). These jobs check the TypeScript, Dart, and Flutter
# samples with `docs/check-snippets.ts`: every fence has a language, every
# sample type-checks or analyzes, and runnable samples print what their
# comments promise.

jobs:
  typescript:
    name: typescript samples
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: build @canvist/headless
        working-directory: packages/canvist-headless
        run: |
          npm ci
          npm run build:wasm

      # The web samples type-check against @canvist/web's sources.
      - name: build @canvist/web's wasm
        working-directory: packages/canvist-web
        run: |
          npm ci
          npm run build:wasm

      # The canvas samples type-check against @canvist/canvas's sources.
      - name: build @canvist/canvas's wasm
        working-directory: packages/canvist-canvas
        run: |
          npm ci
          npm run build:wasm

      - name: check the samples
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net docs/check-snippets.ts ts

  dart:
    name: dart samples
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        # The build hook compiles the crate with the toolchain its
        # `rust-toolchain.toml` pins.
        working-directory: platforms/dart/rust
        run: rustup toolchain install

      - name: cache the build hook's cargo output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: platforms/dart/.dart_tool/hooks_runner
          key: dart-hooks-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'platforms/dart/rust/**') }}
          restore-keys: dart-hooks-${{ runner.os }}-

      - name: install dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: install dependencies
        working-directory: platforms/dart
        run: dart pub get

      - name: check the samples
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net docs/check-snippets.ts dart

  flutter:
    name: flutter samples
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: platforms/flutter/.fvmrc

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: install dependencies
        working-directory: platforms/flutter/example
        run: flutter pub get

      - name: analyze the samples
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net docs/check-snippets.ts flutter
