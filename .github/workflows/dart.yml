name: "dart"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
  # Every pull request, including stacked ones whose base is another
  # feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: platforms/dart

jobs:
  test:
    # The pure Dart package, with the Dart SDK alone: no Flutter.
    name: dart (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Shared runners are slower and noisier than a developer machine.
      CANVIST_PERF_SLACK: "3"
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        # The build hook compiles the crate with the toolchain its
        # `rust-toolchain.toml` pins.
        working-directory: platforms/dart/rust
        run: rustup toolchain install

      - name: cache the build hook's cargo output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: platforms/dart/.dart_tool/hooks_runner
          key: dart-hooks-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'platforms/dart/rust/**') }}
          restore-keys: dart-hooks-${{ runner.os }}-

      - name: install dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5

      - name: install dependencies
        run: dart pub get

      - name: format
        run: dart format --output=none --set-exit-if-changed .

      - name: analyze
        run: dart analyze --fatal-infos

      - name: generated handles are up to date
        run: dart run tool/generate.dart --check

      - name: conformance, api, and server tests
        run: dart test --reporter expanded

      - name: per-call overhead budgets
        run: dart run benchmark/overhead.dart --check

      - name: the example server builds ahead of time and runs
        run: |
          dart build cli --target example/server.dart --output "$RUNNER_TEMP/server"
          PORT=8799 "$RUNNER_TEMP/server/bundle/bin/server" &
          for attempt in $(seq 50); do curl --silent --fail localhost:8799/rooms/ping > /dev/null && break; sleep 0.2; done
          test "$(curl --silent -X POST 'localhost:8799/convert?from=markdown&to=html' -d '# Hi')" = '<h1>Hi</h1>'
          kill %1

  flutter:
    # The editor widget: analysis, widget tests, and golden tests against
    # server rendering, on the host. Integration tests on devices run in
    # `native.yml`.
    name: flutter (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CANVIST_PERF_SLACK: "3"
    defaults:
      run:
        working-directory: platforms/flutter
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        working-directory: platforms/dart/rust
        run: rustup toolchain install

      - name: cache the build hook's cargo output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: platforms/flutter/.dart_tool/hooks_runner
          key: flutter-hooks-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'platforms/dart/rust/**') }}
          restore-keys: flutter-hooks-${{ runner.os }}-

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: platforms/flutter/.fvmrc

      - name: install dependencies
        run: flutter pub get

      - name: format
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test example/patrol_test

      - name: analyze
        run: flutter analyze --fatal-infos

      - name: widget and golden tests
        run: flutter test --reporter expanded

      - name: keep golden mismatches
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssr-golden-${{ matrix.os }}
          path: platforms/flutter/build/ssr_golden
          if-no-files-found: ignore

  publish:
    # Both packages as pub.dev would receive them. `pub publish --dry-run`
    # validates each archive, and the `canvist` archive is then built and
    # tested outside this repository, where its build hook cannot see the
    # Cargo workspace: only the crates.io dependencies its manifest names.
    name: pub.dev archives
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        working-directory: platforms/dart/rust
        run: rustup toolchain install

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: platforms/flutter/.fvmrc

      - name: each package ships the repository's license
        run: |
          cmp ../../license LICENSE
          cmp ../../license ../flutter/LICENSE

      - name: canvist publishes cleanly
        run: |
          dart pub get
          dart pub publish --dry-run

      - name: canvist_flutter publishes cleanly
        working-directory: platforms/flutter
        run: |
          flutter pub get
          flutter pub publish --dry-run

      # pub archives what git tracks, minus ignored files. The crates.io
      # release this version pins does not exist until the release publishes
      # it, so the copy builds those crates from this checkout through a Cargo
      # config patch, never through the workspace.
      - name: the canvist archive builds and passes its tests on its own
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/archive/canvist"
          mkdir -p "$package/.cargo"
          git ls-files -z . | xargs -0 cp --parents --target-directory="$package"
          {
            echo "[patch.crates-io]"
            for crate in $(grep -o '^canvist_[a-z_]*' rust/Cargo.toml); do
              echo "$crate = { path = \"$GITHUB_WORKSPACE/crates/$crate\" }"
            done
          } > "$package/.cargo/config.toml"
          cat "$package/.cargo/config.toml"
          cd "$package"
          dart pub get
          # The conformance fixtures live at the repository root, outside the
          # package.
          dart test --reporter expanded test/api_test.dart test/server_test.dart
