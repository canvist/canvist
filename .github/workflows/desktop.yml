name: "desktop"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
  # Every pull request, including stacked ones whose base is another
  # feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build and test canvist_desktop and the example app on every desktop
  # platform. Input, IME, clipboard, selection, accessibility, collaboration,
  # and screenshots are driven headlessly, so no display is needed; the
  # GPU-against-CPU test runs where the runner has an adapter and says it
  # skipped where it has none.
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        run: rustup toolchain install

      - name: cache rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop

      - name: test the editor
        run: cargo test --locked -p canvist_desktop --all-features

      - name: test the editor core without the window host
        run: cargo test --locked -p canvist_desktop --no-default-features --lib --tests

      - name: build the example app
        run: cargo build --locked -p canvist_desktop_example

      - name: lint
        run: cargo clippy --locked -p canvist_desktop -p canvist_desktop_example --all-features --all-targets -- --deny warnings
