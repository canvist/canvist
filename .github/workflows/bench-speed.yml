name: "bench"

# `bench / speed` stays as a check name. It used to build and run the divan
# benches for the base and the head; that no longer runs. The job reports
# success so a required check still completes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-speed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speed:
    name: speed
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: speed is not measured in CI
        run: echo "Speed is not compared in CI. Measure locally with tools/bench/speed.ts or cargo bench."
