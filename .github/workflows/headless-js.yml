name: "headless-js"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
  # Every pull request, including stacked ones whose base is another
  # feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: packages/canvist-headless

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Shared runners are slower and noisier than a developer machine.
      CANVIST_PERF_SLACK: "3"
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: install dependencies
        run: npm ci

      - name: build the StarterKit, full, and scene wasm modules
        run: npm run build:wasm

      - name: generated types are up to date
        run: npm run check:generated

      - name: type-level tests (tsc --noEmit)
        run: npm run check:types

      - name: conformance and api tests (node)
        run: npm test

      - name: conformance, api, and server tests (deno)
        run: deno task test

      - name: per-call overhead and wasm size budgets
        run: node bench/overhead.ts --check

      - name: the packed package works as a dependency
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null && npm pkg set type=module
          npm install --no-audit --no-fund "$RUNNER_TEMP"/canvist-headless-*.tgz
          node --input-type=module -e 'const { createEngine } = await import("@canvist/headless"); const doc = (await createEngine()).parse("markdown", "**ok**"); if (doc.export("html") !== "<p><strong>ok</strong></p>") process.exit(1);'
          node --input-type=module -e 'const { createEngine, emoji } = await import("@canvist/headless/full"); const doc = (await createEngine([emoji])).create(); doc.typeText(":smile: "); if (doc.export("text") !== "😄 ") process.exit(1);'
