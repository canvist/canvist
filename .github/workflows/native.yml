name: "native"

# Builds the UniFFI/flutter_rust_bridge bindings and runs every native test on
# an iOS Simulator and an Android emulator.
#
# These jobs take 10-20 minutes, so pull requests only run them when they touch
# the native surface, and they are not required checks. Every push to `main`
# and a nightly run cover changes elsewhere (Rust core, toolchains, runner
# images) that could still break the native builds.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/native.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      # canvist_ffi builds on every core crate.
      - "crates/**"
      - "platforms/**"
      - "rust-toolchain.toml"
      - "tools/bench/size.json"
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  apple:
    name: ios (simulator)
    timeout-minutes: 90
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-apple

      - name: install xcodegen and swiftlint
        run: brew install xcodegen swiftlint

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: platforms/flutter/.fvmrc

      # `platforms/flutter/test.sh` runs the Patrol suites with Patrol's CLI.
      - name: install patrol cli
        run: |
          dart pub global activate patrol_cli 4.8.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: lint swift
        run: swiftlint lint --strict

      # Per-step timeouts make a hung simulator or emulator fail fast with logs
      # instead of running into the job timeout.
      - name: test swift package and sample app
        timeout-minutes: 25
        run: platforms/apple/test.sh
        env:
          # Debug builds on a shared runner's simulator.
          CANVIST_PERF_SLACK: "3"

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Budgets only: the native builds run on few pull requests, so there is
      # no base to compare with. `bench / bundle size` tracks the host library.
      - name: native library sizes
        run: |
          node tools/bench/size.ts measure --root . --groups apple --out "$RUNNER_TEMP/sizes.json"
          node tools/bench/size.ts compare --head "$RUNNER_TEMP/sizes.json" --title "native size: iOS"

      - name: test flutter on ios
        timeout-minutes: 45
        run: platforms/flutter/test.sh
        env:
          CANVIST_FLUTTER_PLATFORMS: ios
          # Debug builds on a shared runner's simulator.
          CANVIST_PERF_SLACK: "3"

      # When the step above stalls, say where: the last commands Flutter ran,
      # whether the app is installed, and what it logged. A Dart VM service
      # line in the app's log that Flutter never saw means Flutter's log
      # stream attached too late; no app log means install or launch hung.
      - name: diagnose the simulator
        if: failure()
        working-directory: platforms/flutter/example
        run: |
          set -x
          xcrun simctl list devices booted
          grep -E 'executing:|Waiting for VM Service|VM Service URL' build/flutter-test.log | tail -n 15 || true
          xcrun simctl get_app_container booted io.github.ifiokjr.canvist.canvistFlutterExample || true
          xcrun simctl spawn booted log show --last 90m --style compact \
            --predicate 'process == "Runner"' >build/runner.log || true
          grep -E '\(Flutter\)|VM service' build/runner.log | tail -n 20 || true
          pgrep -fl simctl || true

      - name: upload flutter logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-flutter-logs
          path: |
            platforms/flutter/example/build/flutter-test.log
            platforms/flutter/example/build/runner.log

      - name: upload xcresult
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcresult
          path: platforms/apple/.build/example.xcresult

  android:
    name: android (emulator)
    timeout-minutes: 90
    # Pinned: `ubuntu-latest` moves to 26.04 from 2026-10-19 and the emulator
    # setup (KVM, x86_64 image) is only verified on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-android

      - name: install cargo-run-bin
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-run-bin

      - name: setup flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: platforms/flutter/.fvmrc

      # `platforms/flutter/test.sh` runs the Patrol suites with Patrol's CLI.
      - name: install patrol cli
        run: |
          dart pub global activate patrol_cli 4.8.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: check flutter_rust_bridge bindings are up to date
        timeout-minutes: 15
        working-directory: platforms/dart
        run: |
          dart pub get
          cargo bin flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src

      - name: build android library
        timeout-minutes: 15
        run: platforms/android/build.sh

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: native library sizes
        run: |
          node tools/bench/size.ts measure --root . --groups android --out "$RUNNER_TEMP/sizes.json"
          node tools/bench/size.ts compare --head "$RUNNER_TEMP/sizes.json" --title "native size: Android"

      - name: test on emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          # A software-rendered emulator running a debug build: the keystroke
          # budget gets generous slack.
          script: CANVIST_PERF_SLACK=6 platforms/android/test.sh && CANVIST_FLUTTER_PLATFORMS=android CANVIST_PERF_SLACK=6 platforms/flutter/test.sh

      # Gradle says only that the library's or the sample's instrumented tests
      # failed; their results say which test and why.
      - name: show android test failures
        if: failure()
        run: grep -h -B2 -A25 "<failure" platforms/android/*/build/outputs/androidTest-results/connected/debug/*.xml || true

      # A test that vanishes from Patrol's summary died with the app: its
      # crash is in the device log and Gradle's report.
      - name: upload device logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-logs
          path: |
            platforms/flutter/example/build/logcat.txt
            platforms/flutter/example/build/flutter-test.log
            platforms/flutter/example/build/app/reports/androidTests
            platforms/android/*/build/outputs/androidTest-results
            platforms/android/*/build/reports/androidTests
