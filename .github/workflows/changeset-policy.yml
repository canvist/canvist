name: changeset-policy

# Every pull request: lint the changesets, require one for each changed
# package, prove the website only receives user-facing notes, and dry-run the
# placeholder publish. `publish.yml` dry-runs the registry publishes.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: install monochange
        uses: ./.github/actions/setup-tools
        with:
          monochange: true

      # Matches the Deno version pinned by devenv's nixpkgs input.
      - name: install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      - name: lint config and changesets
        run: mc check

      - name: require changesets for changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          args=(step affected-packages --format md --verify)
          while read -r path; do
            args+=(--changed-paths "$path")
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          while read -r label; do
            [ -n "$label" ] && args+=(--label "$label")
          done < <(jq -r '.[]' <<<"$LABELS_JSON")
          mc "${args[@]}"

      # Right after a release `.changeset` is empty, and `mc preview` fails
      # with nothing to preview. A pull request that changes no package needs
      # no changeset; the step above already requires one for each package
      # that changes.
      - name: preview the release
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            mc preview --format md
          else
            echo "No changesets, so there is no release to preview."
          fi

      - name: verify release provenance and user-facing changelogs
        run: deno test --allow-read --allow-write --allow-run=git,bash,monochange tools/release/

      - name: placeholder publish dry run
        # The lookup talks to the npm registry. A dropped connection is not a
        # policy failure, so retry it.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if mc publish placeholder --dry-run --format md; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
