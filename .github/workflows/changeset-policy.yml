name: changeset-policy

# Every pull request: lint the changesets, require one for each changed
# package, prove the website only receives user-facing notes, and dry-run the
# placeholder publish. `publish.yml` dry-runs the registry publishes.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint config and changesets
        run: mc check
        shell: devenv shell -- bash -e {0}

      - name: require changesets for changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          args=(step affected-packages --format md --verify)
          while read -r path; do
            args+=(--changed-paths "$path")
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          while read -r label; do
            [ -n "$label" ] && args+=(--label "$label")
          done < <(jq -r '.[]' <<<"$LABELS_JSON")
          mc "${args[@]}"
        shell: devenv shell -- bash -e {0}

      # Right after a release `.changeset` is empty, and `mc preview` fails
      # with nothing to preview. A pull request that changes no package needs
      # no changeset; the step above already requires one for each package
      # that changes.
      - name: preview the release
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            mc preview --format md
          else
            echo "No changesets, so there is no release to preview."
          fi
        shell: devenv shell -- bash -e {0}

      - name: verify release provenance and user-facing changelogs
        run: deno test --allow-read --allow-write --allow-run=git,bash,monochange tools/release/
        shell: devenv shell -- bash -e {0}

      - name: placeholder publish dry run
        run: mc publish placeholder --dry-run --format md
        shell: devenv shell -- bash -e {0}
