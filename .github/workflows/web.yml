name: "web"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - ".github/workflows/web.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "examples/web/**"
      - "packages/canvist-collab/**"
      - "packages/canvist-core/**"
      - "packages/canvist-react/**"
      - "packages/canvist-ssr/**"
      - "packages/canvist-vue/**"
      - "packages/canvist-web/**"
      - "rust-toolchain.toml"
  # Every pull request that touches the web surface, including stacked
  # ones whose base is another feature branch.
  pull_request:
    paths: *paths
  schedule:
    - cron: "30 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build @canvist/web, type-check it, and run its unit tests. Its bundle size
  # is the `bench / bundle size` check (`bench-size.yml`).
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm

      - name: install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # @canvist/web reads its extension types from @canvist/core.
      - name: build @canvist/core
        working-directory: packages/canvist-core
        run: |
          npm ci
          npm run build

      # The collaboration tests join the editors as a @canvist/collab peer.
      - name: build @canvist/collab
        working-directory: packages/canvist-collab
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: install dependencies
        working-directory: packages/canvist-web
        run: npm ci

      - name: build wasm
        working-directory: packages/canvist-web
        run: npm run build:wasm

      - name: type-check
        working-directory: packages/canvist-web
        run: npx tsc --noEmit

      - name: unit tests
        working-directory: packages/canvist-web
        run: npm test

  # The examples in `examples/web`: a plain page, React, Vue, and two pages
  # that `server.ts` renders with `@canvist/headless/ssr` on each request
  # (one plain, one React) and the editor hydrates.
  examples:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm

      - name: install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: build @canvist/core
        working-directory: packages/canvist-core
        run: |
          npm ci
          npm run build

      # The server-rendering example renders with @canvist/ssr.
      - name: build @canvist/ssr
        working-directory: packages/canvist-ssr
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: build @canvist/web
        working-directory: packages/canvist-web
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: build and type-check @canvist/react and @canvist/vue
        run: |
          for package in canvist-react canvist-vue; do
            (cd "packages/$package" && npm ci && npx tsc --noEmit && npm run build)
          done

      - name: install dependencies
        working-directory: examples/web
        run: npm ci

      - name: type-check the examples
        working-directory: examples/web
        run: npx tsc --noEmit

      - name: install browsers
        timeout-minutes: 20
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: examples/web
          browsers: chromium firefox webkit

      - name: test the examples
        working-directory: examples/web
        run: npx playwright test

  # Build the wasm and JS the six parity jobs share once. Each matrix cell
  # used to reinstall the Rust toolchain and rebuild the same packages.
  parity-wasm:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm

      - name: install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: build @canvist/core
        working-directory: packages/canvist-core
        run: |
          npm ci
          npm run build

      - name: build @canvist/collab
        working-directory: packages/canvist-collab
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: build @canvist/web wasm
        working-directory: packages/canvist-web
        run: |
          npm ci
          npm run build:wasm

      - name: share builds with the parity matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-parity-wasm
          path: |
            packages/canvist-core/dist
            packages/canvist-collab/dist
            packages/canvist-collab/wasm
            packages/canvist-collab/wasm-full
            packages/canvist-web/wasm
            packages/canvist-web/wasm-collab
            packages/canvist-web/wasm-full
          retention-days: 1

  # Pixel parity between the canvas editor and the server-rendered HTML it
  # hydrates from, in every engine on both desktop platforms. Each run
  # uploads a side-by-side report (canvas | DOM | difference).
  parity:
    needs: parity-wasm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          # Playwright's WebKit build for Ubuntu 26.04 types the 1,000-key
          # burst four times slower than its 24.04 build, with stalls of up
          # to half a second, so the latency budget measures the runner
          # rather than the editor. Stay on 24.04 until that build catches up.
          - ubuntu-24.04
          - macos-latest
        browser:
          - chromium
          - firefox
          - webkit
    runs-on: ${{ matrix.os }}
    env:
      CANVIST_BROWSERS: ${{ matrix.browser }}
      # The 8 ms budget is an Apple silicon number. Linux WebKit on these
      # runners measures 10-26 ms, so scale it the way the other perf jobs do.
      CANVIST_PERF_SLACK: ${{ matrix.os == 'ubuntu-24.04' && matrix.browser == 'webkit' && '4' || '1' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # upload-artifact roots at the least common ancestor of the paths
      # (`packages/`), so download into `packages/` rather than the repo root.
      - name: download shared wasm builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-parity-wasm
          path: packages

      - name: install dependencies
        working-directory: packages/canvist-web
        run: npm ci

      - name: install the browser
        timeout-minutes: 20
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: packages/canvist-web
          browsers: ${{ matrix.browser }}

      - name: pixel parity, editing, and input latency
        working-directory: packages/canvist-web
        run: npx playwright test

      - name: parity report
        if: ${{ !cancelled() }}
        working-directory: packages/canvist-web
        run: |
          node scripts/parity-report.ts --inline
          {
            echo "## Pixel parity: ${{ matrix.browser }} on ${{ matrix.os }}"
            echo
            echo '```'
            node scripts/parity-report.ts | head -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: input latency
        if: ${{ !cancelled() }}
        working-directory: packages/canvist-web
        run: |
          {
            echo "## Input latency: ${{ matrix.browser }} on ${{ matrix.os }}"
            echo
            echo '```json'
            cat report/perf/*.json 2>/dev/null || echo "not measured"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            packages/canvist-web/report/parity/
            packages/canvist-web/report/perf/
          retention-days: 30
