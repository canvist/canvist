name: "website"
permissions:
  contents: read
on:
  # Dispatched by hand on the release pull request: GITHUB_TOKEN opens it,
  # and GitHub starts no pull_request workflows for that.
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - "website/**"
      - "docs/src/**"
      - "docs/book.toml"
      - "crates/*/readme.md"
      - "packages/*/readme.md"
      - "packages/*/README.md"
      - "assets/brand/**"
      # The landing page builds the editor it embeds from these.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/canvist-headless/**"
      - "packages/canvist-web/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: website

jobs:
  # The landing page embeds `@canvist/web` and renders its document with
  # `@canvist/headless/ssr` at build time. Both are built once here, as
  # `web.yml` builds them, and the jobs that build the site download them.
  packages:
    name: build the canvist packages
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build @canvist/headless and @canvist/web
        run: |
          for package in canvist-headless canvist-web; do
            (cd "packages/$package" && npm ci && npm run build:wasm && npm run build)
          done

      - name: upload the built packages
        uses: actions/upload-artifact@v4
        with:
          name: canvist-packages
          if-no-files-found: error
          path: |
            packages/canvist-headless/dist
            packages/canvist-headless/wasm*
            packages/canvist-web/dist
            packages/canvist-web/wasm*

  test:
    name: check, build and test
    needs: packages
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download the built packages
        uses: actions/download-artifact@v4
        with:
          name: canvist-packages
          path: packages

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # A release commit rewrites internal dependencies to versions that are
      # not on npm yet; the site builds from the workspace instead.
      - name: relink internal dependencies
        working-directory: .
        run: deno run --allow-read --allow-write tools/release/relink_workspace_deps.ts

      - name: install dependencies
        run: deno install --frozen

      # Type checking follows the link to packages/canvist-web, which finds
      # @canvist/headless in its own node_modules.
      - name: install @canvist/web's dependencies
        working-directory: packages/canvist-web
        run: npm ci --ignore-scripts

      - name: type check
        run: deno task check

      - name: unit tests
        run: deno task test:unit

      - name: build
        run: deno task build

      - name: check links
        run: deno task check:links

      - name: install playwright chromium
        timeout-minutes: 20
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: website
          command: node node_modules/@playwright/test/cli.js
          browsers: chromium

      - name: end-to-end tests
        run: deno task test:e2e
        env:
          CI: "true"

      # Lighthouse on the production build. Desktop must hit every target
      # (95+ in each category, LCP under 1.5 s, CLS 0); mobile must hit the
      # scores and CLS, and reports LCP over 1.5 s as a warning.
      - name: lighthouse (desktop)
        run: deno task lighthouse:desktop

      - name: lighthouse (mobile)
        if: success() || failure()
        run: deno task lighthouse:mobile

      - name: lighthouse scores
        if: success() || failure()
        run: deno task lighthouse:summary

      # Scrolls the landing page end to end on desktop and with the CPU
      # throttled 4x. Reported in the run summary rather than gating, since
      # shared runners make frame timing noisy.
      - name: scroll performance
        if: success() || failure()
        continue-on-error: true
        run: |
          deno run --allow-net --allow-read tests/serve.ts 4900 &
          sleep 2
          deno task perf:scroll http://127.0.0.1:4900/ perf-reports

      - name: upload performance reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            website/lighthouse-reports
            website/perf-reports
          if-no-files-found: ignore

      - name: upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-reports
          path: |
            website/playwright-report
            website/test-results

  image:
    name: docker image
    # The image compiles the editor's WebAssembly from scratch.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build the image railway deploys
        run: docker build -f website/Dockerfile -t canvist-website --build-arg SITE_URL=https://canvist.example .

      - name: smoke test the container
        run: |
          docker run -d --name website -e PORT=8080 -p 8080:8080 canvist-website
          for attempt in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          for path in / /pricing /services/sync /docs /docs/concepts/how-it-works /docs/crates/canvist_headless /docs/packages/canvist-headless /rive/wet-caret.riv /pagefind/pagefind.js; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$status $path"
            test "$status" = 200
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)" = 404
          curl -s http://127.0.0.1:8080/pricing | grep -q '<link rel="canonical" href="https://canvist.example/pricing">'

  book:
    name: mdbook build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      - name: build the book
        # The site and the book render the same docs/src; both must build.
        run: mdbook build docs

  visual:
    name: visual snapshots (macOS)
    needs: packages
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download the built packages
        uses: actions/download-artifact@v4
        with:
          name: canvist-packages
          path: packages

      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # A release commit rewrites internal dependencies to versions that are
      # not on npm yet; the site builds from the workspace instead.
      - name: relink internal dependencies
        working-directory: .
        run: deno run --allow-read --allow-write tools/release/relink_workspace_deps.ts

      - name: install dependencies
        run: deno install --frozen

      - name: build
        run: deno task build

      - name: install playwright chromium
        timeout-minutes: 20
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: website
          command: node node_modules/@playwright/test/cli.js
          browsers: chromium
          with-deps: "false"

      - name: visual snapshots
        run: deno task test:e2e tests/e2e/visual.spec.ts
        env:
          CI: "true"

      - name: upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-diffs
          path: website/test-results
