name: "testkit"

# Runs the cross-platform testkit: the same Rust tests against the headless
# engine, the agent protocol, and a real browser through Playwright. The
# simulator and emulator targets run there too, through the same jobs the
# native workflow already pays for, once this workflow is merged alongside
# them (see the comment in each job).
#
# Pull requests run the cheap targets on every change to the editor; the
# browser job follows the web workflow's pattern of building what the page
# needs first. The device targets are driven from this workflow on a nightly
# cadence, and from `native`'s simulators whenever that workflow lands the
# testkit agents on them.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/testkit.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "conformance/**"
      - "crates/**"
      - "packages/canvist-headless/**"
      - "packages/canvist-web/tests/pages/testkit.*"
      - "platforms/**"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  engine:
    name: headless + loopback (ubuntu)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/devenv
      - name: Headless and loopback targets
        run: |
          cargo build -p canvist_testkit --bin canvist_testkit_daemon
          CANVIST_TEST_TARGET=headless,loopback cargo nextest run -p canvist_testkit --features collab
        shell: devenv shell -c -- bash -e {0}

  dom:
    name: dom (chromium)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    # Not the devenv action: the page's build needs node and wasm-pack
    # side by side, which the direct installs give and the devenv shell's
    # clean environment does not. The web workflow does the same.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install rust toolchain and the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: cache rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - name: install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack
      - name: install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # What the page needs, built the way the web workflow builds it; the
      # daemon's own preparation then finds everything and skips.
      - name: build @canvist/headless
        working-directory: packages/canvist-headless
        run: |
          npm ci
          npm run build:wasm
          npm run build
      - name: install dependencies
        working-directory: packages/canvist-web
        run: npm ci
      - name: build wasm
        working-directory: packages/canvist-web
        run: npm run build:wasm

      - name: Browser target
        run: CANVIST_TEST_TARGET=dom cargo test -p canvist_testkit --features dom --test typing --test extensions

  ios:
    name: ios (simulator)
    timeout-minutes: 90
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not the devenv action: its nix shell points DEVELOPER_DIR at a
      # MacOSX-only SDK, where the daemon's runner finds no simctl, xcodebuild,
      # or iOS toolchain. The native workflow's apple job builds the same
      # scripts on the runner's own Xcode and rustup.
      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: testkit-apple
      # The step timeout leaves room for the log step below to run inside the
      # job's budget instead of being cut off by it.
      - name: Simulator target
        timeout-minutes: 75
        run: |
          cargo build -p canvist_testkit --features ios --bin canvist_testkit_daemon
          CANVIST_TEST_TARGET=ios cargo test -p canvist_testkit --features ios --test typing -- --test-threads=1 --nocapture
      # The daemon parks its device-run output in target/canvist-testkit; a
      # failed run says so, so the logs belong in the job log.
      - name: show the device run logs
        if: failure()
        run: |
          shopt -s nullglob
          logs=(target/canvist-testkit/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no device run logs were written"
          fi
          for log in "${logs[@]}"; do
            echo "=== ${log##*/} (last 200 lines) ==="
            tail -n 200 "$log" || true
          done

  android:
    name: android (emulator)
    timeout-minutes: 90
    # Pinned: `ubuntu-latest` moves to 26.04 from 2026-10-19 and the emulator
    # setup (KVM, x86_64 image) is only verified on 24.04.
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not the devenv action: its disk-space cleanup deletes the runner's
      # Android SDK at /usr/local/lib/android, and the emulator runner then
      # fails to recreate that root-owned path. The native workflow's android
      # job sets the tools the device run needs up directly instead.
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: cache rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: testkit-android
      # `cargo ndk` in platforms/android/build.sh resolves through the
      # workspace's `bin` alias.
      - name: install cargo-run-bin
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-run-bin
      - name: Emulator target
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cargo build -p canvist_testkit --features android --bin canvist_testkit_daemon
            CANVIST_TEST_TARGET=android cargo test -p canvist_testkit --features android --test typing -- --test-threads=1 --nocapture
      - name: show the device run logs
        if: failure()
        run: |
          shopt -s nullglob
          logs=(target/canvist-testkit/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no device run logs were written"
          fi
          for log in "${logs[@]}"; do
            echo "=== ${log##*/} (last 200 lines) ==="
            tail -n 200 "$log" || true
          done
      # Gradle says only that the agent's instrumented test failed; its
      # results say why.
      - name: show android test failures
        if: failure()
        run: grep -h -B2 -A25 "<failure" platforms/android/*/build/outputs/androidTest-results/connected/debug/*.xml || true
