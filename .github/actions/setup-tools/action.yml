name: setup-tools
description: Install pinned monochange, formatters, and linters without Nix.

inputs:
  monochange:
    description: Install monochange 0.21.0 (mc)
    required: false
    default: "false"
  format:
    description: Install dprint, nightly rustfmt, shfmt, ktlint, nixfmt, and swift-format
    required: false
    default: "false"
  lint:
    description: Install shellcheck and monostyle
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # ktlint 1.8.0 is a script that needs a JVM. Temurin 21 matches publish.yml.
    - name: install java for ktlint
      if: inputs.format == 'true'
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "21"

    - name: install pinned host tools
      shell: bash
      env:
        INSTALL_MONOCHANGE: ${{ inputs.monochange }}
        INSTALL_FORMAT: ${{ inputs.format }}
        INSTALL_LINT: ${{ inputs.lint }}
      run: bash .github/actions/setup-tools/install.sh
