name: devenv
description: "Setup development environment with devenv"
inputs:
  github-token:
    description: Provide a github token
    required: true
  cache-version:
    description: The version of the cache to use.
    required: false
    default: "v1"

runs:
  using: composite
  steps:
    - name: free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true
        df -h /

    - name: cache rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: "${{ inputs.cache-version }}"

    - name: cache cargo binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.bin
        key: ${{ runner.os }}-cargo-bin-${{ inputs.cache-version }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-bin-${{ inputs.cache-version }}-

    - name: install nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: cache nix store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /nix/store
        key: ${{ runner.os }}-nix-${{ inputs.cache-version }}-${{ hashFiles('devenv.nix', 'devenv.yaml') }}
        restore-keys: |
          ${{ runner.os }}-nix-${{ inputs.cache-version }}-

    - name: setup devenv
      run: |
        nix profile install --accept-flake-config nixpkgs#cachix
        cachix use devenv
        nix profile install --accept-flake-config github:cachix/devenv/latest
      shell: bash

    - name: install dependencies
      run: cargo bin --install || true
      shell: devenv shell -- bash -e {0}
