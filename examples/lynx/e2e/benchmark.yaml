# Time the synchronous calls from JavaScript into the native editor and check
# them against their budgets (see `src/benchmark.ts`).
appId: dev.canvist.lynx.example
name: Bridge benchmark
---
- launchApp:
    clearState: true
    # Multiplies the budgets on slow CI devices: `test.sh` passes
    # `CANVIST_PERF_SLACK` as `-e PERF_SLACK`, 1 by default. The flow sets no
    # `env` default, because Maestro applies a flow's `env` after `-e`.
    arguments:
      perfSlack: "${PERF_SLACK}"
- extendedWaitUntil:
    visible: "33 words"
    timeout: 30000
- tapOn: "Benchmark"
- tapOn: "Run benchmark"
- extendedWaitUntil:
    visible: "(Within|Over) budget"
    timeout: 30000
- takeScreenshot: benchmark
- assertVisible: "Within budget"
# The benchmark puts the note back as it found it.
- assertVisible: "33 words"
