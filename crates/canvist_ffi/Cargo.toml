[package]
name = "canvist_ffi"
version.workspace = true
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/canvist_ffi"
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords = ["text-editor", "canvas", "ffi", "uniffi", "mobile"]
license.workspace = true
publish = false
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The canvist editor for iOS and Android: a typed, headless editor with layout, hit testing, a display list to paint, and Yjs collaboration, exported to Swift and Kotlin through UniFFI"

[lib]
# `staticlib` feeds the iOS XCFramework, `cdylib` feeds Android `jniLibs` and
# UniFFI's library-mode bindgen, and `lib` serves the tests and benchmarks.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Build the `uniffi-bindgen` CLI used to generate the Swift and Kotlin sources.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
canvist_headless = { workspace = true, features = ["starter-kit", "collab", "journal"] }
canvist_layout = { workspace = true, features = ["editor", "provisional"] }
rustc-hash = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
divan = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "keystroke"
harness = false
