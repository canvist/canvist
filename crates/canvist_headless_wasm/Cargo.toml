[package]
name = "canvist_headless_wasm"
version = "0.2.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = false
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "wasm-bindgen bindings for canvist_headless with no DOM, for Node, Deno, Bun, and Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Canvas scenes: a second, larger module (`@canvist/headless/scene`), so the
# document module stays small.
scene = ["canvist_headless/scene"]
# Server-side rendering: a third module (`@canvist/headless/ssr`) that renders
# HTML, CSS, and SVG with parley and its own fonts.
ssr = ["canvist_headless/ssr"]
# Every extension, for `@canvist/headless/full`: a second module, so the
# StarterKit module stays small. The emoji table is not compiled in;
# `loadEmoji` supplies it.
full = ["canvist_headless/extras", "dep:canvist_extensions"]

[dependencies]
canvist_extensions = { workspace = true, optional = true, features = ["emoji"] }
canvist_headless = { workspace = true, features = ["collab", "starter-kit"] }
js-sys = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
wasm-bindgen = { workspace = true, features = ["std"] }

[lints]
workspace = true
