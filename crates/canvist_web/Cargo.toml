[package]
name = "canvist_web"
version = "0.2.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = false
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The canvist web host: a Canvas2D editor over canvist_layout, measured by the browser so the canvas wraps exactly like server-rendered HTML"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canvist_headless = { workspace = true, features = ["starter-kit"] }
# No tables by default: the StarterKit schema has none to lay out. `full`
# adds them.
canvist_layout = { workspace = true, features = ["editor", "json"] }
js-sys = { workspace = true, features = ["std"] }
rustc-hash = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
unicode-segmentation = { workspace = true }
wasm-bindgen = { workspace = true, features = ["std"] }
web-sys = { workspace = true, features = ["std", "CanvasRenderingContext2d", "ContextAttributes2d", "HtmlCanvasElement"] }

[features]
default = []
# Collaborate over Yjs. Adds about 250 KB gzipped to the wasm module.
collab = ["canvist_headless/collab"]
# Every extension, for `@canvist/web/full`: their schema, commands, and
# input rules, the emoji table, and the layout and theme for tables, ink,
# kinetic text, and the other blocks and marks beyond the StarterKit.
full = [
	"canvist_headless/full",
	"canvist_layout/ink",
	"canvist_layout/kinetic",
	"canvist_layout/tables",
	"canvist_layout/theme-extensions",
]

[lints]
workspace = true
