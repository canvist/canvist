[package]
name = "canvist_extensions"
version = "0.2.0"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/canvist_extensions"
edition.workspace = true
homepage.workspace = true
# The emoji table and its licence are data the `emoji-data` feature compiles in.
include = [
	"Cargo.toml",
	"license",
	"readme.md",
	"src/**/*.rs",
	"src/emoji/*.txt",
]
keywords = ["text-editor", "rich-text", "editor", "extensions"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "canvist extensions: the TipTap StarterKit and Remirror and TipTap extensions beyond it, each behind its own Cargo feature"

[features]
default = ["starter-kit"]
starter-kit = [
	"blockquote",
	"clipboard",
	"bold",
	"bullet-list",
	"code",
	"code-block",
	"hard-break",
	"heading",
	"history",
	"horizontal-rule",
	"italic",
	"link",
	"ordered-list",
	"strike",
	"task-list",
	"trailing-node",
	"underline",
]
# Every extension in the crate, with the emoji table compiled in.
full = ["extras", "emoji-data"]
# Every extension in the crate; `emoji` without its table, which
# `emoji::load` supplies at runtime.
extras = [
	"starter-kit",
	"callout",
	"character-count",
	"clear-formatting",
	"comments",
	"details",
	"drag-handle",
	"emoji",
	"find-and-replace",
	"hashtag",
	"highlight",
	"ink",
	"kinetic",
	"mathematics",
	"media",
	"mention",
	"placeholder",
	"subscript",
	"superscript",
	"table",
	"table-of-contents",
	"text-align",
	"text-style-kit",
	"typography",
]
# TipTap's TextStyleKit: the `textStyle` mark and every attribute on it.
text-style-kit = [
	"background-color",
	"color",
	"font-family",
	"font-size",
	"line-height",
	"text-style",
]
background-color = ["text-style"]
blockquote = []
bold = []
bullet-list = ["list-item"]
callout = []
character-count = ["dep:unicode-segmentation"]
clipboard = []
code = []
code-block = []
color = ["text-style"]
details = []
emoji = []
# The gemoji table, compiled in.
emoji-data = ["emoji"]
font-family = ["text-style"]
font-size = ["text-style"]
hard-break = []
hashtag = []
heading = []
highlight = []
history = []
horizontal-rule = []
italic = []
line-height = ["text-style"]
link = []
list-item = []
mathematics = []
table = []
table-of-contents = []
find-and-replace = []
comments = []
drag-handle = []
clear-formatting = []
ink = []
kinetic = []
# Images, YouTube and Twitch videos, audio, and file attachments.
media = ["audio", "file", "image", "twitch", "youtube"]
audio = []
file = []
image = []
twitch = []
youtube = []
mention = []
ordered-list = ["list-item"]
placeholder = []
strike = []
subscript = []
superscript = []
task-list = []
text-align = []
text-style = []
trailing-node = []
typography = []
underline = []

[dependencies]
canvist_core = { workspace = true }
canvist_model = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
unicode-segmentation = { workspace = true, optional = true }

[dev-dependencies]
divan = { workspace = true }
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true, features = ["std"] }

[[bench]]
name = "keystroke"
harness = false

[[bench]]
name = "extensions"
harness = false
required-features = ["full"]

[lints]
workspace = true
