[package]
name = "canvist_layout"
version = "0.2.0"
authors.workspace = true
categories.workspace = true
documentation = "https://docs.rs/canvist_layout"
edition.workspace = true
homepage.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "readme.md", "license"]
keywords = ["text-layout", "rich-text", "line-breaking", "bidi", "canvas"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Incremental text and block layout for the canvist editor: line breaking, bidi, hit testing, display lists, and SVG/HTML renderers"

[dependencies]
canvist_core = { workspace = true, optional = true }
canvist_model = { workspace = true }
icu_segmenter = { version = "^2.3", default-features = false, features = ["compiled_data"] }
parley = { version = "^0.12", default-features = false, features = ["std"], optional = true }
rustc-hash = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"], optional = true }
thiserror = { workspace = true }
unicode-bidi = { version = "^0.3", default-features = false, features = ["hardcoded-data", "std"] }
unicode-segmentation = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "layout"
harness = false

[features]
default = ["ink", "kinetic", "provisional", "tables", "theme-extensions"]
# StarterKit theme rules for blocks, marks, and embeds beyond the
# StarterKit. Without it a host whose schema has none of them carries
# none of their styles.
theme-extensions = []
# Draw ink blocks' strokes. Without it an ink block is an empty box.
ink = []
# Move kinetic text when a display list is given a time. Without it the
# text stays still.
kinetic = []
# Lay out and paint provisional text, such as dictation the speech model
# may still revise, and fade text that just became final into ink. Without
# it `DocumentLayout::set_provisional` is absent and nothing is faded.
provisional = []
# Lay tables out on a grid. Without it a table's cells stack like any
# container's children, which keeps hosts whose schema has no tables smaller.
tables = []
editor = ["dep:canvist_core"]
# `StarterKitOptions::from_json`: theme options as `@canvist/web` and
# `@canvist/headless/ssr` pass them.
json = ["dep:serde_json"]
parley = ["dep:parley"]

[lints]
workspace = true
